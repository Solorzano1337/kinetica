<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kinética Expediente Moín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* =====================================================================
   ESTILOS DE KINÉTICA
   - Los colores y fuentes están en :root (tokens). Cambiarlos ahí cambia todo el juego.
   - Cada bloque de abajo corresponde a una pantalla o a un componente y lleva su título.
   - Los @media (max-width:…) ajustan la vista para celular.
   - Al final está el bloque «Cambios del guion (octubre)» con las pantallas nuevas.
   ===================================================================== */
/* Layout: una sola "app" a pantalla completa; HUD arriba, escenario al centro, reloj flotante abajo a la derecha.
   Mundo visual: noche del Caribe + destello neón del reloj Kinética + atardecer de Moín. Tema oscuro deliberado. */
:root{
  --abyss:#06131b; --deep:#0c2431; --panel:#10303f; --line:#24505f;
  --neon:#3df58e; --neon-dim:#1d8d55; --sunset:#ff8f45; --alert:#ff5466;
  --text:#e5f3ef; --muted:#93b4ae; --sand:#ecd7a8; --ink:#04100a;
  --f-display:"Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
p{margin:0}
a{color:var(--neon)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon)}
.muted{color:var(--muted)}
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r)}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a1f2a,#071820);z-index:5}
#hud .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
#hud .brand:hover b{text-shadow:0 0 12px var(--neon)}
#hud .brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;color:var(--neon)}
#hud .brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--text)}
.hbtn:hover{border-color:var(--neon);color:var(--neon)}
.hbtn svg{width:16px;height:16px}
@media (max-width:620px){.hbtn .lbl{display:none}}
#stage{flex:1;position:relative;overflow-y:auto;overflow-x:hidden}
.screen{min-height:100%;position:relative;animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:.0}to{opacity:1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;cursor:pointer;background:var(--neon);color:var(--ink);box-shadow:0 0 0 1px var(--neon),0 0 24px -6px var(--neon)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--neon);color:var(--neon)}
.btn.sun{background:var(--sunset);box-shadow:0 0 0 1px var(--sunset),0 0 24px -6px var(--sunset)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- Escritorio ---------- */
.desk{position:absolute;inset:0;background:
  radial-gradient(1200px 600px at 75% 20%,rgba(61,245,142,.10),transparent 60%),
  radial-gradient(900px 500px at 10% 90%,rgba(255,143,69,.10),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 40px),#081a24;display:flex;flex-direction:column}
.desk-body{flex:1;position:relative;display:grid;place-items:center;padding-block:24px}
.icons{position:absolute;top:20px;left:var(--gut-l);display:flex;flex-direction:column;gap:18px}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-size:12px;color:var(--text);padding:6px;border-radius:6px}
.dicon:hover,.dicon:focus-visible{background:rgba(61,245,142,.12)}
.dicon svg{width:44px;height:44px}
.win{width:min(560px,calc(100% - 32px));background:#0d2532;border:1px solid var(--line);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.win-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0a1e28;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.win-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.win-body{padding:28px 28px 26px;display:grid;gap:16px}
.win-body h1{font-size:clamp(28px,5vw,40px)}
.win-body h1 em{font-style:normal;color:var(--neon);display:block;font-size:1.25em}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.taskbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;background:#06141c;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.where{font-family:var(--f-mono);font-size:13px;color:var(--sunset)}

/* ---------- Cine (video / mensajes) ---------- */
.cine{position:absolute;inset:0;overflow:hidden;background:#000}
.cine .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-1%)}}
.cine::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
  radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65))}
.cine.glitch .bg{animation:kb 40s ease-in-out infinite alternate,glitch 5s steps(1) infinite}
@keyframes glitch{0%,92%,100%{filter:none;clip-path:none}93%{filter:hue-rotate(40deg) saturate(1.6);transform:translateX(-8px) scale(1.06)}95%{clip-path:inset(30% 0 40% 0);transform:translateX(10px) scale(1.06)}97%{filter:contrast(1.6)}}
.cine.dusk .bg{filter:sepia(.45) saturate(1.3) hue-rotate(-20deg) brightness(.85)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-block:20px 22px;background:linear-gradient(180deg,transparent,rgba(3,10,14,.92) 30%)}
.cap-inner{max-width:860px;margin:0 auto;display:grid;gap:12px}
.cap .who{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.cap .txt{font-size:clamp(17px,2.2vw,22px);line-height:1.5;min-height:4.5em;text-shadow:0 1px 2px #000}
.cap .ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cap .ctrl .sp{flex:1}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
.dots i.on{background:var(--neon)}
.rec{position:absolute;top:16px;left:var(--gut-l);z-index:2;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;background:rgba(0,0,0,.55);border:1px solid var(--line);padding:6px 10px;border-radius:4px;display:flex;gap:8px;align-items:center}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--alert);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- Selección ---------- */
.select{padding-block:28px 40px;max-width:1100px;margin:0 auto;display:grid;gap:22px}
.select h2{font-size:clamp(26px,4vw,40px)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:720px){.cards{grid-template-columns:1fr}}
.pc{position:relative;display:grid;grid-template-rows:auto auto;gap:10px;background:linear-gradient(180deg,#0f3242,#0a2230);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--neon)}
.pc[aria-pressed="true"]{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 40px -10px var(--neon)}
.pc .art{height:260px;display:grid;place-items:end center;background:radial-gradient(closest-side,rgba(61,245,142,.16),transparent);border-radius:8px}
.pc .art img{max-height:250px;width:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
@media (max-width:720px){.pc{grid-template-columns:120px 1fr;grid-template-rows:auto;align-items:center}.pc .art{height:150px}.pc .art img{max-height:145px}}
.pc .code{font-family:var(--f-mono);font-size:12px;color:var(--neon)}
.pc h3{font-size:22px}
.pc p{color:var(--muted);font-size:14px}

/* ---------- Mapa ---------- */
.mapscr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;padding-block:20px 90px;max-width:1300px;margin:0 auto;align-items:start}
@media (max-width:860px){.mapscr{grid-template-columns:1fr}}
.mapbox{position:relative;background:radial-gradient(ellipse at 60% 40%,#0f3a4c,#071923 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .lbl{font-family:var(--f-mono);font-size:22px;fill:var(--muted);letter-spacing:.2em}
.mk{cursor:pointer}
.mk .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.mk text{font-family:var(--f-mono);font-size:20px;fill:var(--text)}
.mk.locked{cursor:default}
.mk.locked text{fill:var(--muted)}
.casecard{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
.casecard h2{font-size:clamp(22px,3vw,30px)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.tag.live{border-color:var(--neon-dim);color:var(--neon)}
.tag.sun{border-color:var(--sunset);color:var(--sunset)}
.others{display:grid;gap:8px}
.others div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.mapbar{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Exploración ---------- */
.explore{padding-block:18px 100px;max-width:1240px;margin:0 auto;display:grid;gap:14px}
.ex-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.ex-head h2{font-size:clamp(22px,3.4vw,34px)}
.ex-head p.muted{max-width:62ch;font-size:15px}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:8px 12px;white-space:nowrap}
.counter b{color:var(--neon);font-size:18px}
.scene{position:relative;width:min(100%, max(560px, calc((100dvh - 250px) * 16 / 9)));margin-inline:auto;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0a2230;max-width:100%}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--neon);background:rgba(4,16,10,.35);cursor:pointer;display:grid;place-items:center;padding:0;z-index:3}
.hs::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--neon);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.hs svg{width:20px;height:20px;color:var(--neon)}
.hs .hl{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:11px;background:rgba(4,16,10,.85);border:1px solid var(--neon-dim);padding:3px 7px;border-radius:4px;opacity:0;transition:opacity .15s;pointer-events:none}
.hs:hover .hl,.hs:focus-visible .hl{opacity:1}
.hs.done{border-color:var(--sunset);background:rgba(255,143,69,.25)}
.hs.done::before{display:none}
.hs.done svg{color:var(--sunset)}
@media (max-width:620px){.hs{width:32px;height:32px}.hs svg{width:15px;height:15px}}
.player{position:absolute;height:24%;width:auto;transform:translate(-50%,-100%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:2;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));pointer-events:none}
.player.flip{transform:translate(-50%,-100%) scaleX(-1)}
.player.walk{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{margin-top:-6px}}
.chiplist{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--deep);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--neon)}
.chip .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--neon)}
.chip.done{color:var(--muted)}
.chip.done .st{background:var(--sunset);border-color:var(--sunset)}
.unlock{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;border:1px solid var(--neon);background:linear-gradient(90deg,rgba(61,245,142,.12),transparent);border-radius:10px;padding:14px 90px 14px 16px}

/* ---------- Modal / hojas ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(2,8,12,.72);backdrop-filter:blur(3px);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s ease both}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:20px;flex:1;min-width:0}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;flex:none}
.x:hover{border-color:var(--neon)}
.sheet-b{padding:18px;display:grid;gap:14px}
.sheet-f{padding:0 18px 18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.quote{font-size:17px;border-left:3px solid var(--sunset);padding-left:12px}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.refl{display:grid;gap:4px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.refl p.src{font-family:inherit;font-size:12.5px;line-height:1.45;padding-left:1.4em;text-indent:-1.4em}
.scan{position:relative;border:1px solid var(--neon-dim);border-radius:10px;padding:16px;background:linear-gradient(180deg,rgba(61,245,142,.08),rgba(61,245,142,.02));display:grid;gap:10px;overflow:hidden}
.scan.run::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,rgba(61,245,142,.35),transparent);animation:sweep 1.1s ease-in-out 2}
@keyframes sweep{to{top:100%}}
.scan h4{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.newsp{background:#efe6cf;color:#1f1a12;border-radius:6px;padding:16px;font-family:Georgia,"Times New Roman",serif;display:grid;gap:8px}
.newsp .mast{font-family:var(--f-display);letter-spacing:.2em;font-size:12px;border-bottom:2px solid #1f1a12;padding-bottom:4px}
.newsp h4{margin:0;font-size:22px;line-height:1.15}
.newsp p{font-size:15px}
.reward{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
@media (max-width:520px){.reward{grid-template-columns:1fr;justify-items:center;text-align:center}}
.reward svg{width:120px;height:120px}
.kv{display:grid;gap:10px}
.kv div{display:grid;gap:2px}
.kv b{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon)}
.glowin{animation:glowin 1.2s ease both}
@keyframes glowin{0%{filter:drop-shadow(0 0 0 var(--neon));transform:scale(.6) rotate(-10deg);opacity:0}60%{filter:drop-shadow(0 0 22px var(--neon));transform:scale(1.08)}100%{filter:drop-shadow(0 0 10px var(--neon));transform:none;opacity:1}}

/* ---------- Reloj ---------- */
#watchBtn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:68px;height:68px;border-radius:50%;border:0;background:#071a12;cursor:pointer;box-shadow:0 0 0 2px var(--neon-dim),0 8px 24px rgba(0,0,0,.5);display:grid;place-items:center;padding:0}
#watchBtn svg{width:68px;height:68px}
#watchBtn .wcount{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--neon)}
#watchBtn.buzz{animation:buzz .12s linear 10,glowpulse 1.6s ease-in-out 3}
@keyframes buzz{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
@keyframes glowpulse{50%{box-shadow:0 0 0 2px var(--neon),0 0 40px 6px var(--neon)}}
.wtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 18px}
.wtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wtabs button[aria-selected="true"]{color:var(--neon);border-color:var(--neon)}
.clue{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:4px}
.clue b{font-family:var(--f-display);font-size:16px}
.clue p{font-size:14px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:480px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.badge{display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px}
.badge svg{width:72px;height:72px}
.badge.off{opacity:.35}
.progress{height:8px;border-radius:4px;background:#0a1d26;border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--neon);box-shadow:0 0 12px var(--neon);transition:width .5s}

/* ---------- Repositorio ---------- */
.repo{padding-block:20px 100px;max-width:1150px;margin:0 auto;display:grid;gap:16px}
.repo h2{font-size:clamp(22px,3.4vw,34px)}
.repo-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.repo-grid{grid-template-columns:1fr}}
.files{display:grid;gap:8px}
.file{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.file:hover{border-color:var(--neon)}
.file[aria-current="true"]{border-color:var(--neon);background:#103a33}
.file small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.file .rd{font-family:var(--f-mono);font-size:11px;color:var(--sunset)}
.viewer{background:#0a1d27;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px;min-height:260px}

.nk{aspect-ratio:1;border:0;border-radius:4px;background:#26c6d4;color:#162544;font-size:clamp(18px,3.4vw,34px);font-family:var(--f-display);cursor:pointer;display:grid;place-items:center;padding:0}
.nk:hover,.nk:focus-visible{background:#6fe3ff;outline:2px solid #fff}
.nk.del{background:#ff4a55;color:#fff}
.nk.space{aspect-ratio:auto;width:min(320px,70%);height:52px}
.nk.space span{width:50%;height:12px;border:3px solid #162544;border-top:0}
.equip{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px var(--gut-r) 24px var(--gut-l);background:radial-gradient(700px 500px at 30% 50%,rgba(61,245,142,.18),transparent 70%),#04140d;overflow:auto}
.eq-stage{position:relative;display:grid;place-items:center;min-height:320px}
.eq-char{position:relative;height:min(70vh,520px);max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));transition:filter .4s}
.eq-rings{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.eq-rings i{position:absolute;width:62%;aspect-ratio:3/1;border:3px solid rgba(61,245,142,.0);border-radius:50%;transition:border-color .4s}
.eq-rings i:nth-child(1){top:30%}.eq-rings i:nth-child(2){top:52%}.eq-rings i:nth-child(3){top:74%}
.charging .eq-rings i{border-color:rgba(61,245,142,.85);box-shadow:0 0 18px #3df58e;animation:ringup 1.1s linear infinite}
.charging .eq-rings i:nth-child(2){animation-delay:-.37s}.charging .eq-rings i:nth-child(3){animation-delay:-.74s}
@keyframes ringup{from{transform:translateY(60px) scale(.9);opacity:0}30%{opacity:1}to{transform:translateY(-120px) scale(1.05);opacity:0}}
.charging .eq-char{filter:sepia(1) hue-rotate(80deg) saturate(4) brightness(1.15) drop-shadow(0 0 24px #3df58e);animation:flick .25s steps(2) infinite}
.ready .eq-char{filter:drop-shadow(0 0 22px rgba(61,245,142,.55)) drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.eq-gear{position:absolute;inset:0;pointer-events:none}
.eq-gear .g{position:absolute;width:58px;height:58px;color:#3df58e;opacity:0;transform:scale(.4);transition:opacity .4s,transform .4s}
.eq-gear .g svg{width:100%;height:100%;filter:drop-shadow(0 0 8px #3df58e)}
.eq-gear .g0{left:6%;top:12%}.eq-gear .g1{right:6%;top:12%}.eq-gear .g2{right:8%;top:46%}.eq-gear .g3{right:10%;bottom:12%}
.charging .eq-gear .g,.ready .eq-gear .g{opacity:1;transform:none}
.charging .eq-gear .g1{transition-delay:.5s}.charging .eq-gear .g2{transition-delay:1s}.charging .eq-gear .g3{transition-delay:1.5s}
.eq-side{display:grid;gap:14px;align-content:center;max-width:560px}
.eq-txt{font-size:18px;line-height:1.55;margin:0}
.eq-watch{display:flex;align-items:center;gap:14px;background:none;border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;justify-self:start;font-family:var(--f-display);font-size:18px;color:var(--neon)}
.eq-watch svg{width:76px;height:76px;animation:glowpulse 1.6s ease-in-out infinite;border-radius:50%}
.eq-watch.used{opacity:.6;pointer-events:none}
@media (max-width:760px){.equip{grid-template-columns:1fr;grid-template-rows:auto auto;align-content:start}.eq-stage{height:38vh;min-height:0}.eq-char{height:36vh}.eq-gear .g{width:40px;height:40px}}
.bdef{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:4px;text-align:center}
.joy{position:absolute;left:10px;bottom:10px;width:96px;height:96px;border-radius:50%;background:rgba(4,16,10,.4);border:2px solid rgba(111,227,255,.7);z-index:2;touch-action:none}

.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(111,227,255,.85);box-shadow:0 0 14px #6fe3ff}
.player.kb{transition:none}
.hs.near{box-shadow:0 0 0 4px rgba(255,255,255,.85),0 0 22px var(--neon)}

<script>
/* =====================================================================
   KINÉTICA · EL PODER DEL CONOCIMIENTO (versión 2D)
   Juego educativo del curso 05477, UNED. Todo el juego vive en este archivo:
   no usa frameworks ni compilación. Se lee de arriba abajo en este orden:

    1. Estado ............ ORDER (orden de pantallas), S (avance), save/load
    2. Audio (A) ......... música épica y efectos generados con Web Audio
    3. Voz (V) ........... locución con speechSynthesis del navegador
    4. Utilidades UI ..... toast, openModal, narrate (textos con Saltar/Siguiente)
    5. Arte SVG .......... ICON, reloj, insignias (BADGES), figuras y escenas (SCENES)
    6. Contenido ......... CLUES (pistas de cada elemento investigable)
    7. Navegación ........ go(): cambia de pantalla y guarda el avance
    8. Reloj ............. contador, radar de la zona y pestañas de hallazgos
    9. Menús ............. contenido adicional, créditos y configuración
   10. Pantallas (R) ..... una función R.<clave>() por pantalla, en orden de juego
   11. Bibliotecas ....... REPOS (textos) y REFS (referencias completas)
   12. Desafíos 1 a 4 .... datos (FRAGS, TESTS, Q3, TRI) + su pantalla
   13. Regreso ........... grado, agradecimiento, autoevaluación y expediente
   14. Arranque .......... start(): carga el avance y abre la primera pantalla

   Regla general: casi todo el contenido está en objetos de datos (CLUES,
   REPOS, FRAGS, TESTS, Q3, TRI, AUTO, GUIDE). Para cambiar un texto se edita
   el dato; la lógica de cada pantalla casi nunca necesita tocarse.
   ===================================================================== */
(() => {
"use strict";
/* Atajos: $ busca un elemento, $$ busca varios, sleep espera milisegundos
   y esc() escapa texto antes de meterlo en HTML (evita romper el marcado). */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $("#stage");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ Estado ============ */
/* ORDER: orden fijo de las pantallas. Cada clave corresponde a una función
   R.<clave>() más abajo. S.max guarda el índice más lejano alcanzado, así que
   si se cambia este arreglo hay que migrar las partidas guardadas (ver load()). */
const ORDER = ["cmds","desk","enter","intro","select","equip","map","brief","explore1","repo1","game1","explore2","repo2","game2","holo","repo3","game3","explore3","repo4","game4","grado","gracias","auto","end"];
/* Nombres legibles de cada pantalla (se usan en Configuración → Saltar a). */
const CHAPTER = {enter:"Ingreso a la computadora",cmds:"Comandos",intro:"Video inicial",select:"Selección de personaje",equip:"Pantalla de carga de equipamiento",map:"Mapa de Costa Rica",brief:"Mensaje de Kinética",explore1:"Exploración de la comunidad",repo1:"Repositorio 1",game1:"Desafío 1 · Codificación de hallazgos",explore2:"Exploración en la playa",repo2:"Repositorio 2",game2:"Desafío 2 · Radar de la información",holo:"Mensaje de Kinética (avances y logros)",repo3:"Repositorio 3",game3:"Desafío 3 · Lentes del conocimiento gráfico",explore3:"Exploración en la playa (final)",repo4:"Repositorio 4 · Triangulación",game4:"Desafío 4 · Triangulando la realidad",grado:"Obtención del grado",gracias:"Agradecimiento",auto:"Autoevaluación",end:"Expediente"};
/* Claves de las cuatro insignias, en orden de desafío. */
const BK = ["conocimiento","rigurosidad","interpretacion","cuarta"];
/* Etapa del viaje del héroe según la pantalla: Partida, Iniciación o Regreso. */
const phase = st => { const i = ORDER.indexOf(st); return i <= ORDER.indexOf("brief") ? "Partida" : i < ORDER.indexOf("grado") ? "Iniciación" : "Regreso"; };
/* fresh(): estado inicial de una partida nueva. Campos:
   v (versión del formato), stage (pantalla actual), max (pantalla más lejana),
   char y name (personaje y nombre), conclusion (texto del desafío 4),
   read (bibliotecas leídas), clues (elementos investigados), badges, items
   (reloj, lentes), auto (autoevaluación), warned (aviso sensible) y settings. */
const fresh = () => ({v:3, stage:"cmds", max:0, char:null, name:"", conclusion:"", read:{}, clues:{}, badges:[], items:[], auto:null, warned:false, settings:{music:true, sfx:true, voice:true, speed:"normal", vol:0.5}});
let S = fresh();
/* Clave de localStorage donde se guarda el avance en este navegador. */
const KEY = "kinetica-moin-v1";
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
/* Órdenes anteriores de ORDER. load() los usa para traducir S.max de partidas
   guardadas con versiones viejas del juego (sin v, o con v = 2). */
const OLD_ORDER = ["desk","intro","select","map","brief","explore1","repo1","game1","explore2","repo2","game2","holo","repo3","game3","explore3","repo4","game4","grado","gracias","auto","end"];
const V2_ORDER = ["desk","enter","cmds","intro","select","equip","map","brief","explore1","repo1","game1","explore2","repo2","game2","holo","repo3","game3","explore3","repo4","game4","grado","gracias","auto","end"];
/* Pantalla a la que vuelve «Continuar mi expediente». */
const resumeStage = () => ["cmds","desk","enter"].includes(S.stage) ? ORDER[Math.max(S.max, ORDER.indexOf("intro"))] : S.stage;
/* load(): lee el avance guardado, migra formatos viejos y completa campos que falten. */
function load(){ try{ const t = localStorage.getItem(KEY); if(t){ const o = JSON.parse(t); if(!o.v){ o.max = Math.max(0, ORDER.indexOf(OLD_ORDER[o.max] || "desk")); o.v = 3; } else if(o.v === 2){ o.max = Math.max(0, ORDER.indexOf(V2_ORDER[o.max] || "desk")); o.v = 3; } return Object.assign(fresh(), o, {settings:Object.assign(fresh().settings, o.settings||{})}); } }catch(e){} return null; }

/* ============ Audio (música generada + efectos) ============ */
/* A: todo el sonido del juego, generado en el navegador (no hay archivos de audio).
   - master → music (música y mar) y sfx (efectos). Los volúmenes vienen de S.settings.
   - La música arranca con el primer clic (los navegadores no permiten antes).
   - Para cambiar la música: bars (acordes), mel (melodía) y beat() (qué suena en
     cada corchea). Las notas están en números MIDI: 60 = do central. */
const A = {
  ctx:null, master:null, music:null, sfx:null, timer:null, step:0, ocean:null,
  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = S.settings.vol; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = S.settings.music ? .5 : 0; this.music.connect(this.master);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = S.settings.sfx ? .9 : 0; this.sfx.connect(this.master);
      this.lp = this.ctx.createBiquadFilter(); this.lp.type = "lowpass"; this.lp.frequency.value = 4200; this.lp.connect(this.music);
      this.startLoop();
    }catch(e){ this.ctx = null; }
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  /* Música épica de aventura: ostinato de cuerdas, metales, tambores y melodía heroica (re menor) */
  bars:[{b:38,c:[62,65,69]},{b:34,c:[58,62,65]},{b:41,c:[57,60,65]},{b:36,c:[55,60,64]},{b:38,c:[62,65,69]},{b:34,c:[58,62,65]},{b:36,c:[55,60,64]},{b:33,c:[57,61,64]}],
  mel:[[[0,74,3],[3,69,1],[4,74,2],[6,77,2]],[[0,77,3],[3,76,1],[4,74,4]],[[0,72,3],[3,69,1],[4,72,2],[6,77,2]],[[0,76,6],[6,72,2]],
       [[0,74,3],[3,77,1],[4,81,2],[6,79,2]],[[0,77,3],[3,74,1],[4,70,4]],[[0,72,2],[2,74,2],[4,76,4]],[[0,73,6],[6,69,2]]],
  hz(m){ return 440*Math.pow(2,(m-69)/12); },
  noiseBuf(){ if(this._nb) return this._nb; const n = this.ctx.sampleRate, b = this.ctx.createBuffer(1, n, n), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; return this._nb = b; },
  /* Planificador: cada 60 ms agenda las corcheas que caen en los próximos 0,3 s.
     Así el ritmo no se atrasa aunque el navegador esté ocupado. */
  startLoop(){
    const E = .3; // corchea a 100 ppm
    this.next = this.ctx.currentTime + .1;
    const tick = () => {
      if(!this.ctx) return;
      const now = this.ctx.currentTime;
      if(this.next < now - .5) this.next = now + .05;
      while(this.next < now + .3){ this.beat(this.step, this.next, E); this.next += E; this.step++; }
    };
    this.timer = setInterval(tick, 60);
  },
  /* beat(): decide qué instrumentos suenan en una corchea. Cada frase dura 8
     compases; las frases impares (ph = 1) suman melodía, redoblante y más tambores. */
  beat(step, t, E){
    const e = step % 8, bar = Math.floor(step/8), B = this.bars[bar % 8], ph = Math.floor(bar/8) % 2;
    const pat = [0,12,7,12,0,12,7,12];
    this.str(this.hz(B.b + 12 + pat[e]), t, E*.9);
    if(e === 0){ B.c.forEach(m => this.brass(this.hz(m), t, E*8)); this.str(this.hz(B.b), t, E*8, .05); }
    const hits = ph ? [0,3,4,6] : [0,4];
    if(hits.includes(e)) this.drum(t, e === 0 ? 1 : .6);
    if(ph && (e === 2 || e === 6)) this.snare(t);
    if(ph){ this.mel[bar % 8].forEach(([k, m, l]) => { if(k === e) this.lead(this.hz(m), t, E*l); }); }
    if(bar % 8 === 7 && e === 4) this.swell(t, E*4);
  },
  str(f, t, d, v=.035){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g); g.connect(this.lp); o.start(t); o.stop(t+d+.05);
  },
  brass(f, t, d){
    const f1 = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    f1.type = "lowpass"; f1.frequency.setValueAtTime(350, t); f1.frequency.linearRampToValueAtTime(1900, t+.35); f1.frequency.linearRampToValueAtTime(900, t+d);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.022, t+.12); g.gain.setValueAtTime(.022, t+d*.8); g.gain.linearRampToValueAtTime(0, t+d);
    [-7,7].forEach(dt => { const o = this.ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = dt; o.connect(f1); o.start(t); o.stop(t+d+.05); });
    f1.connect(g); g.connect(this.lp);
  },
  lead(f, t, d){
    const o = this.ctx.createOscillator(), o2 = this.ctx.createOscillator(), g = this.ctx.createGain(), lf = this.ctx.createOscillator(), lg = this.ctx.createGain();
    o.type = "square"; o2.type = "triangle"; o.frequency.value = f; o2.frequency.value = f*2;
    lf.frequency.value = 5.5; lg.gain.value = f*.006; lf.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.03, t+.04); g.gain.setValueAtTime(.03, t+Math.max(.05, d-.08)); g.gain.linearRampToValueAtTime(0, t+d);
    o.connect(g); o2.connect(g); g.connect(this.lp); [o,o2,lf].forEach(x => { x.start(t); x.stop(t+d+.05); });
  },
  drum(t, v){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(42, t+.45);
    g.gain.setValueAtTime(.32*v, t); g.gain.exponentialRampToValueAtTime(.0001, t+.6);
    o.connect(g); g.connect(this.music); o.start(t); o.stop(t+.65);
    const n = this.ctx.createBufferSource(), nf = this.ctx.createBiquadFilter(), ng = this.ctx.createGain();
    n.buffer = this.noiseBuf(); nf.type = "lowpass"; nf.frequency.value = 600; ng.gain.setValueAtTime(.12*v, t); ng.gain.exponentialRampToValueAtTime(.0001, t+.18);
    n.connect(nf); nf.connect(ng); ng.connect(this.music); n.start(t); n.stop(t+.2);
  },
  snare(t){
    const n = this.ctx.createBufferSource(), nf = this.ctx.createBiquadFilter(), ng = this.ctx.createGain();
    n.buffer = this.noiseBuf(); nf.type = "bandpass"; nf.frequency.value = 2200; nf.Q.value = .8;
    ng.gain.setValueAtTime(.05, t); ng.gain.exponentialRampToValueAtTime(.0001, t+.14);
    n.connect(nf); nf.connect(ng); ng.connect(this.music); n.start(t); n.stop(t+.16);
  },
  swell(t, d){
    const n = this.ctx.createBufferSource(), nf = this.ctx.createBiquadFilter(), ng = this.ctx.createGain();
    n.buffer = this.noiseBuf(); n.loop = true; nf.type = "highpass"; nf.frequency.value = 5000;
    ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(.05, t+d); ng.gain.linearRampToValueAtTime(0, t+d+.25);
    n.connect(nf); nf.connect(ng); ng.connect(this.music); n.start(t); n.stop(t+d+.3);
  },
  /* Ruido de mar filtrado para las escenas de playa (lo activa go()). */
  setOcean(on){
    if(!this.ctx) return;
    if(on && !this.ocean){
      const len = this.ctx.sampleRate*2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
      const g = this.ctx.createGain(); g.gain.value = .05;
      const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(); lfo.frequency.value = .12; lg.gain.value = .04; lfo.connect(lg); lg.connect(g.gain);
      src.connect(f); f.connect(g); g.connect(this.music); src.start(); lfo.start();
      this.ocean = {src, lfo};
    } else if(!on && this.ocean){ try{ this.ocean.src.stop(); this.ocean.lfo.stop(); }catch(e){} this.ocean = null; }
  },
  /* tone(): nota simple para efectos (frecuencia, duración, forma, volumen,
     retraso, deslizamiento). Los efectos de abajo combinan varios tonos. */
  tone(f, d=.15, type="sine", v=.2, when=0, slide){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t+d+.05);
  },
  click(){ this.tone(900,.05,"square",.05); },
  scan(){ this.tone(300,1.1,"sawtooth",.05,0,1600); this.tone(1200,.12,"sine",.12,1.15); },
  ok(){ this.tone(660,.12,"triangle",.18); this.tone(990,.2,"triangle",.18,.1); },
  bad(){ this.tone(180,.25,"square",.08); },
  buzz(){ for(let i=0;i<5;i++) this.tone(110,.08,"square",.08,i*.12); try{ navigator.vibrate && navigator.vibrate([90,60,90,60,140]); }catch(e){} },
  absorb(){
    if(!this.ctx) return; const t = this.ctx.currentTime;
    const n = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    n.buffer = this.noiseBuf(); n.loop = true; f.type = "bandpass"; f.Q.value = 3; f.frequency.setValueAtTime(180, t); f.frequency.exponentialRampToValueAtTime(5200, t+2.6);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t+2.2); g.gain.linearRampToValueAtTime(0, t+2.8);
    n.connect(f); f.connect(g); g.connect(this.sfx); n.start(t); n.stop(t+2.9);
    this.tone(70, 2.6, "sawtooth", .07, 0, 1400); this.tone(1800, .5, "sine", .2, 2.6, 90);
  },
  electric(){
    if(!this.ctx) return; const t = this.ctx.currentTime;
    for(let i=0;i<16;i++){
      const at = t + Math.random()*2.2, n = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
      n.buffer = this.noiseBuf(); f.type = "highpass"; f.frequency.value = 1500 + Math.random()*4000;
      g.gain.setValueAtTime(.25, at); g.gain.exponentialRampToValueAtTime(.0001, at+.03+Math.random()*.06);
      n.connect(f); f.connect(g); g.connect(this.sfx); n.start(at); n.stop(at+.1);
    }
    this.tone(110, 2.3, "sawtooth", .06, 0, 1300); this.tone(220, 2.3, "square", .025, 0, 2600);
    [784,988,1175,1568].forEach((f,i) => this.tone(f, .4, "triangle", .14, 2.3+i*.09));
  },
  popup(){ this.tone(740,.09,"sine",.15); this.tone(1110,.16,"sine",.13,.09); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.35,"triangle",.16,i*.13)); },
  apply(){
    if(!this.ctx) return;
    this.master.gain.value = S.settings.vol;
    this.music.gain.value = S.settings.music ? .5 : 0;
    this.sfx.gain.value = S.settings.sfx ? .9 : 0;
  }
};

/* V: locución con la voz del sistema. Prefiere español de Costa Rica, México o
   Latinoamérica. say(texto, {pitch, rate}) lee en voz alta si la voz está activa. */
const V = {
  voice:null,
  pick(){ try{ const vs = speechSynthesis.getVoices(); this.voice = vs.find(v=>/es[-_](CR|MX|US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null; }catch(e){} },
  say(text, opt={}){
    if(!S.settings.voice || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[«»]/g,""));
      if(!this.voice) this.pick();
      if(this.voice) u.voice = this.voice;
      u.lang = this.voice ? this.voice.lang : "es-ES";
      u.pitch = opt.pitch ?? 1; u.rate = opt.rate ?? 1;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};
try{ speechSynthesis.onvoiceschanged = () => V.pick(); }catch(e){}

/* openModal(): abre una ventana sobre el juego con el HTML dado. Los botones con
   data-close la cierran; también se cierra con Esc o tocando fuera. */
function openModal(html, onClose){
  const m = $("#modal"); m.innerHTML = html; m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ""; V.stop(); onClose && onClose(); };
  m.onclick = e => { if(e.target === m) close(); };
  $$("[data-close]", m).forEach(b => b.onclick = close);
  const f = m.querySelector("button, a, input, select"); f && f.focus();
  return close;
}

const speedMs = () => ({lenta:42, normal:22, rapida:7})[S.settings.speed] || 22;

/* Narrador: escribe párrafos uno a uno con botón Siguiente; lee en voz alta si está activo */
function narrate(root, {who, paras, voice={}, endLabel, onEnd}){
  let i = 0, typing = false, skipType = false;
  root.innerHTML = `<div class="cap wrap"><div class="cap-inner">
     <div class="who">${esc(who)}</div><div class="txt" aria-live="polite"></div>
     <div class="ctrl"><div class="dots">${paras.map(()=>"<i></i>").join("")}</div><span class="sp"></span>
       <button class="btn ghost" type="button" data-skip>Saltar</button><button class="btn" type="button" data-next>Siguiente</button></div></div></div>`;
  const txt = $(".txt", root), next = $("[data-next]", root), skip = $("[data-skip]", root);
  async function show(){
    $$(".dots i", root).forEach((d,k)=>d.classList.toggle("on", k<=i));
    const p = paras[i]; txt.textContent = ""; typing = true; skipType = false;
    V.say(p, voice);
    next.textContent = i === paras.length-1 ? (endLabel||"Continuar") : "Siguiente";
    for(let c=0;c<p.length;c++){ if(skipType){ txt.textContent = p; break; } txt.textContent += p[c]; if(c%3===0) await sleep(speedMs()*3); }
    typing = false;
  }
  next.onclick = () => { A.click(); if(typing){ skipType = true; return; } if(i < paras.length-1){ i++; show(); } else { V.stop(); onEnd(); } };
  skip.onclick = () => { V.stop(); skipType = true; onEnd(); };
  show();
}

/* ============ Navegación ============ */
/* go(): pasa a la pantalla indicada. Guarda el avance, muestra u oculta el HUD,
   enciende el sonido del mar en la playa y llama a R[st]() para dibujarla. */
function go(st){
  A.click(); V.stop();
  S.stage = st; S.max = Math.max(S.max, ORDER.indexOf(st)); save();
  $("#modal").hidden = true;
  stage.scrollTop = 0;
  const showHud = !["desk","enter"].includes(st);
  $("#hud").hidden = !showHud;
  $("#hMap").hidden = ORDER.indexOf(st) < ORDER.indexOf("map") || st === "map";
  $("#hudCase").textContent = ORDER.indexOf(st) >= ORDER.indexOf("brief") ? "Caso 01 · Moín · " + phase(st) : "Sociedad de Personas Investigadoras";
  A.setOcean(["explore2","explore3","brief","holo"].includes(st));
  updateWatch();
  document.body.classList.toggle("ingame", /^game/.test(st));
  (R[st] || R.desk)();
}

/* ============ Reloj ============ */
function totalClues(){ return Object.keys(CLUES).length; }
/* Actualiza el botón del reloj (abajo a la derecha) con el contador de pistas. */
function updateWatch(){
  const b = $("#watchBtn");
  b.hidden = !S.items.includes("reloj");
  const n = Object.keys(S.clues).length;
  b.innerHTML = watchSVG(n/totalClues()) + `<span class="wcount">${n}/${totalClues()}</span>`;
}
/* Hace vibrar el reloj (animación, sonido y vibración del teléfono). */
function buzzWatch(){ const b = $("#watchBtn"); b.classList.remove("buzz"); void b.offsetWidth; b.classList.add("buzz"); A.buzz(); }
$("#watchBtn").onclick = () => { A.click(); openWatch(ZONE_OF[S.stage] && /^explore/.test(S.stage) ? "radar" : "hallazgos"); };
/* Zona de trabajo según la pantalla actual (la usa el radar). */
const ZONE_OF = {explore1:"comunidad",repo1:"comunidad",game1:"comunidad",explore2:"playa",repo2:"playa",game2:"playa",holo:"playa",repo3:"playa",game3:"playa",explore3:"final",repo4:"final",game4:"final"};
/* Convierte un ícono <svg> en un grupo <g> para meterlo dentro de otro SVG. */
const icoG = str => str.replace(/^<svg([^>]*)>/, (m, a) => "<g" + a.replace(/\s(viewBox|width|height)="[^"]*"/g, "") + ">").replace(/<\/svg>\s*$/, "</g>");
/* Radar de la zona: dibuja los elementos de la zona alrededor del reloj, más la
   archivista y el agente. Naranja = ya investigado. Tocar uno lo señala en la escena. */
function radarHTML(){
  const z = ZONE_OF[S.stage] || (S.max >= ORDER.indexOf("explore3") ? "final" : S.max >= ORDER.indexOf("explore2") ? "playa" : "comunidad");
  const sc = SCENES[z];
  const items = [...sc.spots.map(p => ({id:p.id, label:p.label, kind:p.kind, ok:!!S.clues[p.id]})),
    {id:"npc-repo", label:"Archivista de Kinética", kind:"book", ok:!!S.read[sc.repo.key]},
    {id:"npc-des", label:"Agente de desafío", kind:"flag", ok:S.max > ORDER.indexOf(sc.des.game)}];
  const R0 = 150, C = 230, N = items.length;
  const nodes = items.map((it, i) => { const a = -Math.PI/2 + i*2*Math.PI/N, x = C + Math.cos(a)*R0, y = C + Math.sin(a)*R0*.92;
    const ca = Math.cos(a), side = Math.abs(ca) > .3, anc = side ? (ca > 0 ? "start" : "end") : "middle";
    const lx = side ? x + (ca > 0 ? 34 : -34) : x, ly = side ? y + 5 : y + (Math.sin(a) < 0 ? -36 : 46);
    return `<line x1="${C}" y1="${C}" x2="${x}" y2="${y}" stroke="${it.ok?"#ff8f45":"#3df58e"}" stroke-opacity=".6" stroke-width="2"/>
      <g class="rn" data-rid="${it.id}" tabindex="0" role="button" aria-label="${esc(it.label)}${it.ok?" (investigado)":""}"><circle cx="${x}" cy="${y}" r="26" fill="#071a14" stroke="${it.ok?"#ff8f45":"#3df58e"}" stroke-width="3"/>
      <g transform="translate(${x-11} ${y-11}) scale(.92)" style="color:${it.ok?"#ff8f45":"#3df58e"}">${icoG(it.ok?ICON.check:ICON[it.kind]||ICON.scan)}</g>
      <text x="${lx}" y="${ly}" text-anchor="${anc}" fill="#e5f3ef" font-size="13" font-family="Atkinson Hyperlegible, sans-serif">${esc(it.label)}</text></g>`; }).join("");
  return `<div class="radar"><p class="eyebrow">Radar de la zona · ${esc(sc.title.replace(/^Exploración (de la|en la) /i,""))}</p>
    <svg viewBox="${innerWidth < 560 ? "40 40 380 380" : "-120 0 700 480"}" class="${innerWidth < 560 ? "narrow" : ""}" role="img" aria-label="Radar del reloj con los elementos de la zona">
      <circle cx="${C}" cy="${C}" r="${R0}" fill="none" stroke="#1d8d55" stroke-dasharray="4 6"/>
      ${nodes}
      <circle cx="${C}" cy="${C}" r="44" fill="#061510" stroke="#3df58e" stroke-width="4" style="filter:drop-shadow(0 0 14px #3df58e)"/>
      <g transform="translate(${C-16} ${C-16})" style="color:#3df58e"><g transform="scale(1.33)">${icoG(ICON.scan)}</g></g>
    </svg>
    <div class="rlist">${items.map(it => `<span class="${it.ok?"ok":""}"><i></i>${esc(it.label)}</span>`).join("")}</div>
    <p class="src">${/^explore/.test(S.stage) ? "Tocá un elemento del radar para ubicarlo en la escena." : "El radar muestra la zona en la que estás trabajando."}</p></div>`;
}
/* Ventana del reloj con pestañas: radar, hallazgos, insignias y objetos. */
function openWatch(tab){
  const n = Object.keys(S.clues).length;
  const zones = [["comunidad","Comunidad"],["playa","Playa (día)"],["final","Playa (final)"]];
  const body = {
    radar: radarHTML(),
    hallazgos: zones.map(([z,l]) => {
      const list = Object.entries(CLUES).filter(([id,c]) => c.zone === z);
      return `<div class="eyebrow">${l} · ${list.filter(([id])=>S.clues[id]).length}/${list.length}</div>` +
        list.map(([id,c]) => S.clues[id] ? `<div class="clue"><b>${esc(c.title)}</b><p>${esc(c.short)}</p>${c.src?`<span class="src">Fuente: ${esc(c.src)}</span>`:""}</div>` : `<div class="clue" style="opacity:.45"><b>Sin investigar</b><p>Buscá este elemento en la zona.</p></div>`).join("");
    }).join(""),
    insignias: `<div class="badges">${["conocimiento","rigurosidad","interpretacion","cuarta"].map(k => `<div class="badge ${S.badges.includes(k)?"":"off"}">${badgeSVG(k)}<span>${BADGES[k].name}</span><small class="bdef">${BADGES[k].def}</small></div>`).join("")}</div>
      <p class="muted">${S.badges.length} de 4 insignias. Reunilas todas para ser miembro oficial de Kinética.</p>`,
    objetos: `<div class="reward">${watchSVG(n/totalClues(), true)}<div class="kv"><div><b>Reloj de la Sociedad Kinética</b><span>Escanea objetos, traduce lo que escuchás y guarda cada pista con su fuente.</span></div></div></div>` +
      (S.items.includes("lentes") ? `<div class="reward">${LENS_SVG}<div class="kv"><div><b>Lentes del conocimiento gráfico</b><span>Te dejan leer ejes, escalas y tendencias en los gráficos del caso.</span></div></div></div>` : "")
  };
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Reloj Kinética">
    <div class="sheet-h"><div style="width:44px;height:44px">${watchSVG(n/totalClues())}</div><h3>Reloj Kinética${S.name?` · ${esc(S.name)}`:""}</h3><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
    <div class="wtabs" role="tablist">${["radar","hallazgos","insignias","objetos"].map(t=>`<button role="tab" type="button" data-t="${t}" aria-selected="${t===tab}">${t}</button>`).join("")}</div>
    <div class="sheet-b"><div class="progress" aria-label="Avance del caso"><i style="width:${Math.round((S.max/(ORDER.length-1))*100)}%"></i></div>${body[tab]}</div></div>`);
  $$("#modal [data-t]").forEach(b => b.onclick = () => openWatch(b.dataset.t));
  $$("#modal .rn").forEach(g => { const f = () => { const h = $(`.hs[data-id="${g.dataset.rid}"]`); $("#modal").hidden = true; $("#modal").innerHTML = ""; if(h){ h.classList.add("near"); h.focus(); setTimeout(() => h.classList.remove("near"), 2400); } }; g.onclick = f; g.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); f(); } }; });
}

  let done = false;
  const finish = () => { if(done) return; done = true; go("intro"); };

  const rc = el => { const r = el.getBoundingClientRect(), o = root.getBoundingClientRect(); return {x:(r.left-o.left)*devicePixelRatio, y:(r.top-o.top)*devicePixelRatio, w:r.width*devicePixelRatio, h:r.height*devicePixelRatio}; };
  const scr = rc($("#monScr")), who = rc($("#who"));

  const cols = ["#3df58e","#6fe3ff","#ffffff","#2a9df4","#a6ffcf"];
  const P = [];
  const spawn = k => { for(let i=0;i<k;i++){ const x = who.x + Math.random()*who.w, y = who.y + Math.random()*who.h*.9; const dx = x-cx, dy = y-cy; P.push({r:Math.hypot(dx,dy), a:Math.atan2(dy,dx), w:(1.6+Math.random()*1.8), v:(.35+Math.random()*.5), s:(3+Math.random()*6)*devicePixelRatio, c:cols[i%cols.length]}); } };

    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  };

    await sleep(900); if(done) return;
    $("#absCap").textContent = "La computadora te absorbe…"; A.absorb(); absorbing = true; t0 = performance.now();
    pop.style.opacity = 0; scrEl.style.opacity = 1; vt.classList.add("spin"); whoEl.classList.add("dissolve");
    requestAnimationFrame(loop);
    await sleep(3300); if(done) return;
    absorbing = false; whoEl.style.display = "none"; vt.classList.remove("spin"); scrEl.classList.add("flash");
    $("#absCap").textContent = "Aparece la pantalla, pero ya no hay nadie frente a ella.";
    await sleep(2200); finish();
  })();
};

/* Asignación de nombre con teclado en pantalla (también acepta el teclado físico). */
function nameScreen(){
  const MAXN = 14; let nm = (S.name || "").toUpperCase().slice(0, MAXN);
  const L = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
  stage.innerHTML = `<section class="screen"><div class="namescr wrap">
    <div class="nm-who"><img src="assets/p${(S.char??0)+1}.png" alt="Tu personaje"><span class="code">${CHARS[S.char??0].code}</span></div>
    <h2 class="cmd-title">Asignale un nombre</h2>
    <div class="nm-line" id="nmLine" aria-live="polite"></div>
    <div class="nm-keys">${L.map(l=>`<button type="button" class="nk" data-l="${l}">${l}</button>`).join("")}<button type="button" class="nk del" id="nkDel" aria-label="Borrar"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M8 5h12v14H8l-6-7z"/><path d="M11 9l6 6M17 9l-6 6"/></svg></button></div>
    <button type="button" class="nk space" id="nkSp" aria-label="Espacio"><span></span></button>
    <p class="src">También podés escribir con el teclado. Máximo ${MAXN} letras.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" type="button" id="nmBack">Cambiar personaje</button><button class="btn sun" type="button" id="nmOk">Listo</button></div>
  </div></section>`;
  const paint = () => { $("#nmLine").textContent = nm || " "; $("#nmOk").disabled = nm.trim().length < 2; };
  const add = ch => { if(nm.length < MAXN){ nm += ch; A.click(); paint(); } };
  $$(".nk[data-l]").forEach(b => b.onclick = () => add(b.dataset.l));
  $("#nkDel").onclick = () => { nm = nm.slice(0,-1); A.click(); paint(); };
  $("#nkSp").onclick = () => { if(nm && !nm.endsWith(" ")) add(" "); };
  const kb = e => {
    if(!document.body.contains($("#nmLine"))) return document.removeEventListener("keydown", kb);
    if(e.key === "Backspace"){ e.preventDefault(); nm = nm.slice(0,-1); paint(); }
    else if(e.key === "Enter" && !$("#nmOk").disabled){ e.preventDefault(); $("#nmOk").click(); }
    else if(e.key === " " && document.activeElement === document.body){ e.preventDefault(); if(nm && !nm.endsWith(" ")) add(" "); }
    else if(/^[a-zñáéíóúü]$/i.test(e.key)){ add(e.key.toUpperCase().normalize("NFD").replace(/[́̈]/g,"").normalize("NFC")); }
  };
  document.addEventListener("keydown", kb);
  $("#nmBack").onclick = () => { document.removeEventListener("keydown", kb); R.select(); };
  $("#nmOk").onclick = () => { document.removeEventListener("keydown", kb); S.name = nm.trim().split(/\s+/).map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(" "); save(); A.ok(); go("equip"); };
  paint();
}

};

/* renderExplore(): pantalla de exploración de una zona. Se juega en tres pasos:
   1) investigar todos los spots, 2) hablar con la archivista (biblioteca),

function renderExplore(key){
  const sc = SCENES[key];
  const ids = sc.spots.map(s=>s.id);
  const cnt = () => ids.filter(id=>S.clues[id]).length;
  const secDone = () => cnt() === ids.length;
  const repoDone = () => !!S.read[sc.repo.key];
  const NPC = {"npc-repo":Object.assign({role:"repo"}, sc.repo), "npc-des":Object.assign({role:"des"}, sc.des)};
  const locked = id => id === "npc-repo" ? !secDone() : !(secDone() && repoDone());
  stage.innerHTML = `<section class="screen"><div class="explore wrap">
    <div class="ex-head"><div style="display:grid;gap:6px;min-width:0"><p class="eyebrow">${sc.zone}</p><h2>${sc.title}</h2><p class="muted">${sc.intro}</p></div>

    <div class="scene" id="scene">${sc.svg().replace(/<\/svg>\s*$/, npcArt(sc) + "</svg>")}
      ${sc.spots.map(s=>`<button class="hs ${S.clues[s.id]?"done":""}" type="button" data-id="${s.id}" style="left:${s.x/16}%;top:${s.y/9}%" aria-label="${s.label}">${S.clues[s.id]?ICON.check:ICON[s.kind]}<span class="hl">${s.label}</span></button>`).join("")}
      ${Object.entries(NPC).map(([id,n])=>`<button class="hs npc npc-${n.role} ${locked(id)?"locked":""}" type="button" data-id="${id}" style="left:${n.x/16}%;top:${n.y/9}%" aria-label="${n.label}">${n.role==="repo"?ICON.book:ICON.flag}<span class="hl">${n.label}</span></button>`).join("")}
      <img class="player" id="player" src="assets/p${(S.char??0)+1}.png" alt="Tu personaje" style="left:${sc.start[0]/16}%;top:${sc.start[1]/9}%">
      ${sc.chat ? '<div class="chatb" id="chatb" aria-hidden="true" hidden></div>' : ""}
    </div>
    <div class="chiplist">${sc.spots.map(s=>`<button class="chip ${S.clues[s.id]?"done":""}" type="button" data-id="${s.id}"><span class="st"></span>${s.label}</button>`).join("")}
      ${Object.entries(NPC).map(([id,n])=>`<button class="chip npcchip npc-${n.role}" type="button" data-id="${id}"><span class="st"></span>${n.label}</button>`).join("")}</div>
    <div id="exStep" class="unlock" aria-live="polite"></div>
  </div></section>`;
  const pl = $("#player");
  let px = sc.start[0], py = sc.start[1];
  /* Mueve al personaje hasta el elemento tocado (con animación). */
  const walkTo = async (s) => {
    const tx = s.x + (s.x > 800 ? -110 : 110), ty = Math.min(Math.max(s.y + 150, 520), 890);
    pl.classList.remove("kb");
    pl.classList.toggle("flip", tx < px); px = tx; py = ty;
    pl.classList.add("walk"); pl.style.left = (tx/16)+"%"; pl.style.top = (ty/9)+"%";
    await sleep(matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 900);
    pl.classList.remove("walk");
  };
  /* Actualiza el recuadro de abajo con el paso actual (1, 2 o 3). */
  const paintStep = () => {
    const box = $("#exStep");
    $$(".hs.npc").forEach(b => b.classList.toggle("locked", locked(b.dataset.id)));
    if(!secDone()) box.innerHTML = `<div><p class="eyebrow">Paso 1 de 3 · Información secundaria</p><p>Investigá los ${ids.length} elementos marcados. Llevás ${cnt()}. Las personas que conversan entre sí no se pueden tocar: leé lo que dicen.</p></div>`;
    else if(!repoDone()) box.innerHTML = `<div><p class="eyebrow">Paso 2 de 3 · El reloj vibró</p><p>Repositorio desbloqueado. Hablá con la ${sc.repo.label.replace(/^Archivista/,"archivista")} para leer los textos.</p></div><button class="btn sun" type="button" data-go="npc-repo">Ir con la archivista</button>`;
    else box.innerHTML = `<div><p class="eyebrow">Paso 3 de 3 · Desafío desbloqueado</p><p>Hablá con el agente de desafío para entrar a ${sc.des.name}.</p></div><button class="btn" type="button" data-go="npc-des">Ir con el agente</button>`;
    const g = box.querySelector("[data-go]"); if(g) g.onclick = () => interact(g.dataset.go);
  };
  /* Conversación con la archivista o el agente (o aviso si aún está bloqueado). */
  const talkNpc = id => {
    const n = NPC[id];
    if(locked(id)){
      openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${n.label}"><div class="sheet-h"><h3>${n.label}</h3><span class="tag">Bloqueado</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
        <div class="sheet-b"><p class="quote">${esc(n.locked)}</p></div><div class="sheet-f"><button class="btn ghost" type="button" data-close>Entendido</button></div></div>`);
      V.say(n.locked); return;
    }
    if(n.role === "repo"){
      openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${n.label}"><div class="sheet-h"><h3>${n.label}</h3><span class="tag sun">NPC de repositorio</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
        <div class="sheet-b"><p class="quote">${esc(n.hello)}</p><div class="kv"><div><b>En la biblioteca</b><span>${REPOS[n.key].docs.map(d=>esc(d.t)).join(" · ")}</span></div></div></div>
        <div class="sheet-f"><button class="btn sun" type="button" id="npcGo">Abrir la biblioteca</button></div></div>`);
      V.say(n.hello);
      $("#npcGo").onclick = () => go(n.key);
    } else {
      openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${n.label}"><div class="sheet-h"><h3>${n.label}</h3><span class="tag live">NPC de desafío</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
        <div class="sheet-b"><div class="phrase"><q>${esc(n.phrase)}</q></div><p>Desafío ${n.num} de 4: <b>${esc(n.name)}</b>.</p></div>
        <div class="sheet-f"><button class="btn" type="button" id="npcGo">Iniciar el desafío</button></div></div>`);
      V.say(n.phrase, {pitch:.6, rate:.9});
      $("#npcGo").onclick = () => go(n.game);
    }
  };
  /* Al tocar un elemento: caminar hasta él y abrir su ficha o su conversación. */
  const interact = async id => {
    A.click();
    const s = sc.spots.find(x=>x.id===id) || NPC[id];
    await walkTo(s);
    if(NPC[id]) return talkNpc(id);
    openClue(id, () => {
      $$(`[data-id="${id}"]`).forEach(b=>b.classList.add("done"));
      const h = $(`.hs[data-id="${id}"]`); if(h) h.innerHTML = ICON.check + `<span class="hl">${s.label}</span>`;
      $("#cnt").textContent = `${cnt()}/${ids.length}`;
      paintStep();
      if(secDone()){ buzzWatch(); toast("El reloj vibra: Repositorio de Información desbloqueado"); $("#exStep").scrollIntoView({behavior:"smooth", block:"center"}); }
    });
  };
  $$("[data-id]", stage).forEach(b => b.onclick = () => interact(b.dataset.id));
  paintStep();
  /* Bucle de movimiento: lee teclas y mando, mueve al personaje dentro del suelo
     (y entre 520 y 890) y resalta el elemento más cercano (a menos de 150). */
  /* Movimiento libre: flechas o WASD en computadora, mando flotante en móvil */
  const scene = $("#scene"), keys = new Set(), joy = {x:0, y:0};
  const targets = () => [...sc.spots.map(x => ({id:x.id, x:x.x, y:x.y})), ...Object.entries(NPC).map(([id,n]) => ({id, x:n.x, y:n.y}))];
  let near = null;
  const hint = document.createElement("div"); hint.className = "nearhint"; hint.hidden = true; scene.appendChild(hint);
  const touch = matchMedia("(pointer:coarse)").matches;
  if(touch){
    const jz = document.createElement("div"); jz.className = "joy"; jz.innerHTML = "<i></i>"; jz.setAttribute("aria-label","Mando para caminar"); scene.appendChild(jz);
    const kn = jz.querySelector("i"); let pid = null;
    const mv = e => { const r = jz.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2); const m = Math.hypot(dx,dy), R0 = r.width/2; if(m > R0){ dx *= R0/m; dy *= R0/m; } joy.x = dx/R0; joy.y = dy/R0; kn.style.transform = `translate(${dx}px,${dy}px)`; };
    jz.onpointerdown = e => { pid = e.pointerId; jz.setPointerCapture(pid); mv(e); };
    jz.onpointermove = e => { if(e.pointerId === pid) mv(e); };
    jz.onpointerup = jz.onpointercancel = () => { pid = null; joy.x = joy.y = 0; kn.style.transform = ""; };
  }
  const KM = {arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1], arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0]};
  const typing = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
  const kd = e => {
    if(!document.body.contains(scene)) return cleanup();
    if(!$("#modal").hidden || typing()) return;
    const k = e.key.toLowerCase();
    if(KM[k]){ e.preventDefault(); keys.add(k); if(document.activeElement && document.activeElement.classList.contains("hs")) document.activeElement.blur(); }
    else if((k === "enter" || k === "e") && near && !(document.activeElement && document.activeElement.tagName === "BUTTON")){ e.preventDefault(); keys.clear(); interact(near); }
  };
  const ku = e => keys.delete(e.key.toLowerCase());
  const cleanup = () => { document.removeEventListener("keydown", kd); document.removeEventListener("keyup", ku); };
  document.addEventListener("keydown", kd); document.addEventListener("keyup", ku);
  let last = performance.now();
  const loop = now => {
    if(!document.body.contains(scene)){ cleanup(); return; }
    const dt = Math.min(.05, (now - last)/1000); last = now;
    let vx = joy.x, vy = joy.y;
    keys.forEach(k => { vx += KM[k][0]; vy += KM[k][1]; });
    const m = Math.hypot(vx, vy);
    if(m > .15 && $("#modal").hidden){
      vx /= Math.max(1, m); vy /= Math.max(1, m);
      px = Math.min(1540, Math.max(60, px + vx*420*dt)); py = Math.min(890, Math.max(520, py + vy*300*dt));
      pl.classList.add("kb", "walk"); if(Math.abs(vx) > .2) pl.classList.toggle("flip", vx < 0);
      pl.style.left = (px/16) + "%"; pl.style.top = (py/9) + "%";
      let best = null, bd = 1e9;
      targets().forEach(t => { const ay = Math.min(Math.max(t.y + 150, 520), 890), d = Math.hypot((t.x - px)/1.4, ay - py); if(d < bd){ bd = d; best = t; } });
      const nid = bd < 150 ? best.id : null;
      if(nid !== near){
        $$(".hs.near", scene).forEach(b => b.classList.remove("near")); near = nid;
        if(near){ const b = $(`.hs[data-id="${near}"]`, scene); b && b.classList.add("near"); hint.hidden = false; hint.textContent = touch ? "Tocá el elemento para investigar" : "Enter o E para investigar"; hint.style.left = (best.x/16) + "%"; hint.style.top = ((best.y - 34)/9) + "%"; }
        else hint.hidden = true;
      }
    } else pl.classList.remove("walk");
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  if(sc.chat){
    let k = 0; const bub = $("#chatb");
    const step = () => {
      if(!document.body.contains(bub)) return clearInterval(tm);
      const [who, text] = sc.chat.lines[k % sc.chat.lines.length], pt = sc.chat[who];
      bub.hidden = false; bub.style.left = (pt.x/16) + "%"; bub.style.top = (pt.y/9) + "%";
      bub.innerHTML = `<b>${esc(pt.name)}</b>${esc(text)}`; bub.classList.remove("in"); void bub.offsetWidth; bub.classList.add("in"); k++;
    };
    const tm = setInterval(step, 4200); step();
  }
}
/* openClue(): ficha de un elemento. Muestra lo que se ve (lines) y el botón para
   escanear; al escanear guarda la pista en S.clues y muestra el registro del reloj. */
function openClue(id, onDone){
  const c = CLUES[id];
  const already = !!S.clues[id];
  const isTalk = !!c.who;
  const body = c.news
    ? `<div class="newsp"><div class="mast">EL ECO DE MOÍN · ARCHIVO</div><h4>${esc(c.lines[0])}</h4>${c.lines.slice(1).map(l=>`<p>${esc(l)}</p>`).join("")}</div>`
    : c.lines.map(l => `<p class="${l.startsWith("«")?"quote":""}">${esc(l)}</p>`).join("");
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.title)}">
    <div class="sheet-h"><h3>${esc(c.title)}</h3><span class="tag sun">${esc(c.tag)}</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
    <div class="sheet-b">${body}
      <div class="scan" id="scanBox" ${already?"":"hidden"}><h4>Registro del reloj</h4><p>${esc(c.scan)}</p>${(c.refs||[]).length?`<div class="refl"><span class="src">Referencias</span>${c.refs.map(k=>`<p class="src">${REFS[k]}</p>`).join("")}</div>`:(c.src?`<span class="src">Fuente: ${esc(c.src)}</span>`:"")}</div></div>
    <div class="sheet-f">${already?`<button class="btn ghost" type="button" data-close>Cerrar</button>`:`<button class="btn" type="button" id="doScan">${esc(c.action)}</button>`}</div></div>`);
  if(isTalk) V.say(c.lines.join(" "), {pitch:1, rate:1.02});
  const b = $("#doScan");
  if(b) b.onclick = async () => {
    b.disabled = true; A.scan();
    const box = $("#scanBox"); box.hidden = false; box.classList.add("run"); box.querySelector("p").style.opacity = .15;
    await sleep(1300);
    box.classList.remove("run"); box.querySelector("p").style.opacity = 1;
    S.clues[id] = true; save(); updateWatch(); A.ok();
    b.outerHTML = `<button class="btn" type="button" data-close>Guardado en el reloj</button>`;
    const fin = () => { $("#modal").hidden = true; $("#modal").innerHTML = ""; V.stop(); onDone(); };
    $("#modal .sheet-f [data-close]").onclick = fin;
    $("#modal .sheet-h [data-close]").onclick = fin;
    $("#modal .sheet-f [data-close]").focus();
    $("#modal").onclick = e => { if(e.target.id === "modal") fin(); };
  };

/* Pantalla de biblioteca: lista de textos a la izquierda y lector a la derecha. */
function renderRepo(key){
  const R0 = REPOS[key]; const read = new Set();
  stage.innerHTML = `<section class="screen"><div class="repo wrap">
    <div style="display:grid;gap:6px"><p class="eyebrow">NPC de repositorio · Archivista de Kinética</p><h2>${R0.title}</h2><p class="muted">${R0.intro}</p></div>
    <div class="repo-grid"><div class="files" role="list">${R0.docs.map((d,i)=>`<button class="file" type="button" role="listitem" data-i="${i}">${ICON.file}<span><b>${esc(d.t)}</b><small>${esc(d.k)}</small></span><span class="rd" data-r="${i}"></span></button>`).join("")}</div>
    <article class="viewer" id="viewer" aria-live="polite"><p class="muted">Elegí un texto de la lista para abrirlo.</p></article></div>
    <div class="phrase" id="phrase" ${S.read[key]?"":"hidden"}><p class="eyebrow">Biblioteca completa · Desafío desbloqueado</p><p>${esc(R0.done)}</p><div><button class="btn" type="button" id="backZone">${esc(R0.backLabel)}</button></div></div>
    <p class="src" id="left">Textos leídos: 0/${R0.docs.length}</p>
  </div></section>`;
  const show = i => {
    const d = R0.docs[i]; read.add(i); A.click();
    $$(".file").forEach(f=>f.setAttribute("aria-current", f.dataset.i==i));
    $("#viewer").innerHTML = `<p class="eyebrow">${esc(d.k)}</p><h3>${esc(d.t)}</h3>${d.b.map(p=>`<p>${esc(p)}</p>`).join("")}${(d.ref||[]).length?`<div class="refl"><span class="src">Referencias</span>${d.ref.map(r=>`<p class="src">${REFS[r]||esc(r)}</p>`).join("")}</div>`:""}`;
    $(`[data-r="${i}"]`).textContent = "LEÍDO";
    $("#left").textContent = `Textos leídos: ${read.size}/${R0.docs.length}`;
    if(read.size === R0.docs.length && !S.read[key]){ S.read[key] = true; save(); $("#phrase").hidden = false; A.ok(); buzzWatch(); toast("Desafío desbloqueado: volvé con el agente de desafío"); }
  };
  $$(".file").forEach(f => f.onclick = () => show(+f.dataset.i));
  $("#backZone").onclick = () => go(R0.back);
  show(0);
}

const WHY1 = {
  "Los vecinos ya no bajan a la playa de noche por miedo.":"Describe cómo se siente la comunidad: es percepción de inseguridad.",
  "Las redes criminales comercializan los huevos y la carne de tortuga.":"Describe el modo de operar de las bandas criminales (Mongabay, 2013).",

const cap = c => FRAGS.filter(f=>f.c===c).length;
/* Desafío 1: arrastrar (o tocar y tocar) cada fragmento a su categoría.
   Cada acierto queda apilado en su categoría con su número de orden y su código.
   Tras dos errores con el mismo fragmento, se muestra dónde va y se resalta. */
R.game1 = () => {
  const order = FRAGS.map((f,i)=>i).sort(()=>Math.random()-.5);
  const fill = {inseg:0, inst:0, socio:0, none:0}; let placed = 0, sel = null; const ERR1 = {};
  stage.innerHTML = `<section class="screen"><div class="g1 wrap">
    <div style="display:grid;gap:6px"><p class="eyebrow">Desafío 1 de 4 · Dinámica de asociación</p><h2>La codificación de hallazgos</h2>
    <p class="muted">Arrastrá cada fragmento flotante hasta su categoría de análisis. En pantallas táctiles también podés tocar el fragmento y luego la categoría. Cada acierto carga la categoría con energía de conocimiento. Cada fragmento tiene un código de tres partes: categoría (PI inseguridad, CI institucional, AS socioambiental), escenario (C comunidad, P playa) y fuente. Uno no encaja en ninguna categoría: guardalo aparte.</p>${guideBtn("game1")}</div>
    <div class="cloud" id="cloud">${order.map(i=>`<div class="frag" tabindex="0" role="button" data-i="${i}">${esc(FRAGS[i].t)}</div>`).join("")}</div>
    <p class="fb" id="fb" aria-live="polite"></p>
    <div class="bins">${Object.entries(CATS).map(([k,c])=>`<button class="bin" type="button" data-c="${k}"><h3><span class="long">${c.t}</span><span class="short">${c.s}</span></h3><p>${c.d}</p><div class="energy"><i></i></div><span class="src" data-n="${k}">0/${cap(k)}</span><span class="stack" data-s="${k}" aria-live="polite"></span></button>`).join("")}</div>
  </div></section>`;
  const fb = $("#fb");
  /* Intenta colocar un fragmento en una categoría y da retroalimentación. */
  const tryPlace = (fragEl, cat) => {
    const f = FRAGS[+fragEl.dataset.i];
    if(f.c === cat){
      A.ok(); fill[cat]++; placed++;
      fragEl.remove(); sel = null;
      const bin = $(`.bin[data-c="${cat}"]`);
      const it = document.createElement("span"); it.className = "it";
      it.innerHTML = `<span class="n">${placed}</span><span class="tx"><b>${esc(f.code)}</b> ${esc(f.t)}</span>`;
      it.title = f.t; bin.querySelector(".stack").appendChild(it);
      bin.querySelector(".energy i").style.width = (fill[cat]/cap(cat)*100)+"%";
      $(`[data-n="${cat}"]`).textContent = `${fill[cat]}/${cap(cat)}`;
      $$(".bin").forEach(x=>x.classList.remove("hint"));
      fb.className = "fb ok"; fb.textContent = cat === "none" ? `Guardado aparte. ${f.n} Código provisional: ${f.code}.` : `Bien codificado (${f.code}). ${WHY1[f.t] || ""}`;
      if(fill[cat] === cap(cat)){ bin.classList.add("full"); A.fanfare(); if(cat !== "none") fb.textContent = `Categoría completa: ${CATS[cat].t}.`; }
      if(placed === FRAGS.length){ $(".g1").classList.add("done"); fb.className = "fb ok"; fb.textContent = "¡Codificaste los 13 fragmentos! Así quedó tu matriz, en el orden en que los encontraste."; setTimeout(()=>earnBadge("conocimiento", "¡Felicidades, has superado el desafío 1!", "explore2", "Ir a la playa"), 3200); }
    } else {
      A.bad(); fragEl.classList.remove("bad"); void fragEl.offsetWidth; fragEl.classList.add("bad");
      const ix = +fragEl.dataset.i; ERR1[ix] = (ERR1[ix] || 0) + 1; fb.className = "fb no";
      if(ERR1[ix] >= 2){ fb.textContent = `Respuesta: este fragmento va en «${CATS[f.c].t}». ${WHY1[f.t] || f.n || ""} Tocá esa categoría (está resaltada) para colocarlo.`; $$(".bin").forEach(x=>x.classList.toggle("hint", x.dataset.c === f.c)); }
      else fb.textContent = `Ese fragmento va en otra categoría. Pista: ${HINT[f.c]}`;
    }
  };
  // tocar para seleccionar
  $$(".frag").forEach(el => {
    el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); select(el); } };
    let sx, sy, moved = false, ghost = null;
    el.addEventListener("pointerdown", e => {
      sx = e.clientX; sy = e.clientY; moved = false; el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", e => {
      if(sx === undefined) return;
      if(!moved && Math.hypot(e.clientX-sx, e.clientY-sy) > 8){ moved = true; ghost = el.cloneNode(true); ghost.classList.add("drag"); document.body.appendChild(ghost); el.style.opacity = .3; }
      if(moved){ ghost.style.left = (e.clientX-130)+"px"; ghost.style.top = (e.clientY-20)+"px";
        const t = document.elementFromPoint(e.clientX, e.clientY); $$(".bin").forEach(b=>b.classList.toggle("hover", !!t && b.contains(t))); }
    });
    const end = e => {
      if(sx === undefined) return; sx = undefined;
      $$(".bin").forEach(b=>b.classList.remove("hover"));
      if(moved){ ghost && ghost.remove(); el.style.opacity = 1;
        const t = document.elementFromPoint(e.clientX, e.clientY); const bin = t && t.closest(".bin");
        if(bin) tryPlace(el, bin.dataset.c);
      } else select(el);
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", () => { sx = undefined; ghost && ghost.remove(); el.style.opacity = 1; });
  });
  function select(el){ A.click(); $$(".frag").forEach(f=>f.classList.toggle("sel", f===el && !el.classList.contains("sel") ? true : false)); sel = el.classList.contains("sel") ? el : null; fb.className = "fb"; fb.textContent = sel ? "Ahora tocá la categoría donde va ese fragmento." : ""; }
  $$(".bin").forEach(b => b.onclick = () => { if(sel) tryPlace(sel, b.dataset.c); else { fb.className="fb"; fb.textContent = "Primero elegí o arrastrá un fragmento."; } });
};

/* Gráfico de barras horizontal en SVG a partir de {l, v} (etiqueta, valor). */
function barChart({title, src, data, max}){
  const narrow = innerWidth < 600;
  const W = narrow ? 420 : 640, padL = narrow ? 150 : 200, padR = 64, top = 10, rowH = narrow ? 64 : 58, h = top + data.length*rowH + 36;
  const fs = narrow ? 15 : 13;
  const sc = v => (W-padL-padR) * v / max;
  const ticks = narrow ? [0, max/2, max] : [0, max/4, max/2, max*3/4, max];
  return `<p class="ctitle">${esc(title)}</p><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}">
    ${ticks.map(t=>`<line x1="${padL+sc(t)}" y1="${top}" x2="${padL+sc(t)}" y2="${h-30}" stroke="#24505f" stroke-dasharray="3 4"/><text x="${padL+sc(t)}" y="${h-10}" fill="#93b4ae" font-size="${fs-2}" text-anchor="middle">${Math.round(t).toLocaleString("es-CR")}</text>`).join("")}
    ${data.map((d,i)=>{ const y = top + i*rowH + rowH*0.2, bh = rowH*0.6; return `
      <text x="${padL-10}" y="${y+bh/2+5}" fill="#e5f3ef" font-size="${fs}" text-anchor="end">${esc(d.l)}</text>
      <rect x="${padL}" y="${y}" width="${Math.max(sc(d.v),2)}" height="${bh}" rx="3" fill="${d.c||"#3df58e"}"/>
      <text x="${padL+Math.max(sc(d.v),2)+8}" y="${y+bh/2+5}" fill="${d.c||"#3df58e"}" font-size="${fs+1}" font-weight="600">${d.v.toLocaleString("es-CR")}</text>`; }).join("")}
  </svg><p class="src">Fuente: ${esc(src)}</p>`;
}
/* Gráfico de 1.000 puntos (una cría cada uno) para la pregunta de supervivencia. */
function dotsChart(){
  const narrow = innerWidth < 600, cols = narrow ? 25 : 50, rows = narrow ? 40 : 20, s = 12; let out = "";
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const k = r*cols+c; const hi = k === 517; const blk = (Math.floor(c/5) + Math.floor(r/20)) % 2; out += `<circle cx="${8+c*s}" cy="${8+r*s}" r="${hi?5.4:3.6}" fill="${hi?"#ff8f45":(blk?"#2c6b5a":"#3a8f73")}"/>`; }
  return `<p class="ctitle">1.000 crías de tortuga marina (cada punto = 1 cría)</p><p class="src" style="margin-bottom:8px">Cada bloque de color = 100 crías, más o menos lo que trae 1 nido. El punto naranja es la única que, en promedio, llega a adulta.</p>
    <svg viewBox="0 0 ${cols*s+4} ${rows*s+4}" role="img" aria-label="1.000 crías representadas con puntos; una sola llega a adulta" style="max-width:${narrow?340:640}px">${out}</svg><p class="src">Fuente: Mongabay (2013)</p>`;
}
