<!doctype html>
<!--
=========================================================================
 KINÉTICA · EL PODER DEL CONOCIMIENTO (versión 2D)
 Juego educativo del curso 05477 Investigación en Ciencias Sociales, UNED.

 Esta página solo arma el esqueleto y carga los archivos en orden.
 El juego está repartido en carpetas:

   estilos/     cómo se ve (colores, pantallas, celular)
   motor/       lo que hace funcionar el juego (estado, sonido, navegación,
                movimiento, arranque)
   arte/        dibujos en SVG (íconos, figuras, escenas, mapa)
   contenido/   TEXTOS: narraciones, diálogos, pistas, bibliotecas,
                referencias, desafíos, insignias y autoevaluación.
                Para cambiar lo que dice el juego, casi siempre basta con
                editar un archivo de esta carpeta.
   pantallas/   una o varias pantallas por archivo (inicio, exploración,
                reloj, desafíos, regreso…)
   assets/      imágenes (fondos y personajes)

 Los scripts son clásicos (no módulos) y comparten un mismo espacio de
 nombres: lo que declara un archivo lo pueden usar los que se cargan después.
 Por eso el ORDEN de las etiquetas <script> importa:
   1) motor base, estado, sonido e interfaz
   2) arte básico (íconos y gráficos) y contenido (datos)
   3) escenas y mapa (usan el contenido)
   4) navegación y movimiento
   5) pantallas
   6) arranque (siempre al final)
 Al agregar un archivo nuevo, ponerlo en el grupo que le corresponde.

 Se puede abrir con doble clic o desde un servidor local
 (python3 -m http.server). Más detalles en herramientas/LEEME.md.
=========================================================================
-->
