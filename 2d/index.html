          $("#tfb").innerHTML = `<div class="verdict no"><b>Todavía no</b><span>Fijate en la palabra «siempre»: ¿las tres fuentes la respaldan?</span></div>`; }
      });
      return;
    }
    $("#tri").innerHTML = head + `<div class="g2-grid" style="margin-top:14px"><div class="tcards">${T.cards.map((c,i)=>`<button class="tc" type="button" data-i="${i}" aria-pressed="false"><span class="who">${esc(c.t)} · ${esc(c.who)}</span><span>${esc(c.q)}</span></button>`).join("")}</div>
      <div class="radar tri"><div id="trisvg">${triSVG(0)}</div><p class="src" id="tcnt" style="text-align:center">Fuentes elegidas: 0/3</p><button class="btn" type="button" id="tVer" disabled style="width:100%">Verificar el triángulo</button></div></div><div id="tfb" style="margin-top:12px"></div>`;
    bindHint();
    const sync = () => { $("#trisvg").innerHTML = triSVG(pick.size); $("#tcnt").textContent = `Fuentes elegidas: ${pick.size}/3`; $("#tVer").disabled = pick.size !== 3; };
    $$(".tc", $("#tri")).forEach(b => b.onclick = () => {
      const i = +b.dataset.i; A.click();
      if(pick.has(i)){ pick.delete(i); b.setAttribute("aria-pressed","false"); $("#tfb").innerHTML = ""; }
      else if(pick.size < 3){ pick.add(i); b.setAttribute("aria-pressed","true"); $("#tfb").innerHTML = ""; }
      else { $("#tfb").innerHTML = `<div class="verdict no"><b>Ya elegiste tres</b><span>Quitá una fuente para cambiarla.</span></div>`; }
      sync();
    });
    $("#tVer").onclick = () => {
      const bad = [...pick].map(i=>T.cards[i]).filter(c=>!c.ok);
      if(!bad.length){ A.ok(); $$(".tc", $("#tri")).forEach(b=>b.disabled = true); $("#tVer").disabled = true;
        $("#tfb").innerHTML = `<div class="verdict ok"><b>Triángulo cerrado</b><span>${esc(T.win)}</span>${explainCards(T)}</div><div style="margin-top:10px"><button class="btn" type="button" id="tNext">${r < TRI.length-1 ? "Siguiente acertijo" : "Siguiente"}</button></div>`;
        $("#tNext").onclick = next; $("#tNext").focus();
      } else { A.bad(); fails++;
        $("#tfb").innerHTML = `<div class="verdict no"><b>Ese triángulo no se sostiene</b><span>${bad.map(c=>esc(c.who)+": "+esc(c.why)).join(" ")}</span></div>${fails >= 2 ? `<div style="margin-top:10px"><button class="btn ghost" type="button" id="tShow">Mostrar las tres fuentes correctas</button></div>` : ""}`;
        const sb = $("#tShow"); if(sb) sb.onclick = () => { pick = new Set(T.cards.map((c,k)=>c.ok?k:-1).filter(k=>k>=0)); $$(".tc", $("#tri")).forEach(b=>b.setAttribute("aria-pressed", pick.has(+b.dataset.i))); sync(); $("#tfb").innerHTML = `<div class="verdict" style="border:1px solid var(--line);background:var(--deep)"><b>Estas son las tres fuentes</b><span>Tocá «Verificar el triángulo» para cerrarlo y leer por qué cada una sirve.</span></div>`; }; }
    };
  };
  /* Redacción final: CHECKS son las reglas de la lista de revisión (expresiones
     regulares). Con todas cumplidas se reclama la insignia; el texto se guarda en
     S.conclusion y aparece en el expediente. */
  const writeStage = () => {
    $("#tp").style.width = "100%";
    $("#tIntro").textContent = "Última parte: redactá la conclusión del caso con lo que confirmaste en los acertijos.";
    const CHIPS = ["Las fuentes revisadas muestran que", "El testimonio de", "coincide con", "Además, el registro de WIDECAST (citado por Mongabay, 2013) indica que", "(Mongabay, 2013)", "(Latin American Sea Turtles, 2023)", "Sin embargo, estos datos no permiten afirmar que", "Haría falta"];
    const MODEL = "Las fuentes revisadas muestran que vehículos ajenos a la comunidad entran de noche a la playa de Moín: el testimonio del pescador, las huellas de llanta en la arena y el registro del perro guardián coinciden, aunque no dependen unas de otras. Además, el registro de WIDECAST indica que con patrullaje policial se salvaron unos 1.750 nidos y sin él unos seis (WIDECAST, citado por Mongabay, 2013), lo que sugiere una asociación entre la vigilancia nocturna y la protección de los nidos. Sin embargo, estos datos no permiten afirmar que el patrullaje sea la única causa; haría falta comparar más temporadas y entrevistar a más personas de la comunidad.";
    const CHECKS = [
      {id:"len", t:"Tiene entre 60 y 180 palabras.", f:(x,w) => w >= 60 && w <= 180, tip:"Ajustá la extensión: entre 60 y 180 palabras."},
      {id:"hal", t:"Responde con un hallazgo del caso (vigilancia, vehículos, nidos).", f:x => /(veh[ií]cul|carro|patrull|vigilanc|nido|saque)/i.test(x), tip:"Decí qué se encontró: por ejemplo, que entran vehículos de noche o que con patrullaje se salvan más nidos."},
      {id:"src", t:"Menciona al menos dos tipos de fuente.", f:x => [/(testimonio|pescador|lideresa|bi[oó]logo|vecin|entrevist)/i, /(registro|widecast|documento|informe|dato|cifra|1\.?750)/i, /(huella|perro|observ|evidencia|reloj)/i].filter(rx => rx.test(x)).length >= 2, tip:"Nombrá las fuentes que coinciden: un testimonio, un documento o dato, una evidencia física u observación."},
      {id:"cit", t:"Cita al menos una fuente con autor y año, como (Mongabay, 2013).", f:x => /\([^()]*\b(19|20)\d{2}\)/.test(x), tip:"Agregá la cita del dato que usás: (Mongabay, 2013), (El Universo, 2012) o (WIDECAST, citado por Mongabay, 2013)."},
      {id:"cau", t:"Usa lenguaje de evidencia (muestra, sugiere, indica, coincide).", f:x => /(muestra|sugiere|indica|se asocia|asociaci|coincid|apunta)/i.test(x), tip:"Usá verbos prudentes: «muestra», «sugiere», «indica», «coincide»."},
      {id:"lim", t:"Reconoce una limitación.", f:x => /(sin embargo|aunque|limitaci|no permite|no prueba|no demuestra|har[ií]a falta|no alcanza)/i.test(x), tip:"Agregá un límite: «Sin embargo, estos datos no permiten afirmar que…» o «Haría falta…»."},
      {id:"abs", t:"Evita palabras absolutas (siempre, nunca, demostrado).", f:x => x.trim().length > 0 && !/(\bsiempre\b|\bnunca\b|demostrad|comprobad|todo el mundo|\bnadie\b|definitivamente|sin duda)/i.test(x), tip:"Quitá palabras absolutas como «siempre», «nunca», «demostrado» o «sin duda»."}
    ];
    $("#tri").innerHTML = `<div class="tcard"><div class="who">Redacción · conclusión del caso</div><blockquote>¿Qué se puede concluir sobre la vigilancia nocturna y el saqueo de nidos en Moín?</blockquote></div>
      <div class="wr-grid">
        <div class="wr-main">
          <label for="wTxt" class="eyebrow">Tu conclusión (entre 60 y 180 palabras)</label>
          <textarea id="wTxt" class="txtin wr-area" placeholder="Escribí aquí tu conclusión…">${esc(S.conclusion || "")}</textarea>
          <p class="src" id="wCount">0 palabras</p>
          <div class="wr-chips"><span class="eyebrow">Frases de apoyo</span>${CHIPS.map((c,k)=>`<button type="button" data-chip="${k}">${esc(c)}…</button>`).join("")}</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn" type="button" id="wCheck">Revisar mi conclusión</button><button class="btn ghost" type="button" id="wModel">Ver un ejemplo</button></div>
          <div id="wfb" aria-live="polite"></div>
        </div>
        <aside class="wr-side"><p class="eyebrow">Lista de revisión</p><ul class="checks" id="wChecks"></ul>
          <p class="src">Una buena conclusión responde la pregunta, se apoya en los resultados, no trae datos nuevos, señala sus límites (Bermúdez Rubio et al., 2021) y cita cada dato que no es propio.</p></aside>
      </div>`;
    const ta = $("#wTxt");
    const words = () => (ta.value.trim().match(/\S+/g) || []).length;
    const paint = () => {
      const w = words(); $("#wCount").textContent = `${w} palabra${w === 1 ? "" : "s"}`;
      $("#wChecks").innerHTML = CHECKS.map(c => { const ok = c.f(ta.value, w); return `<li class="${ok?"ok":""}"><i>${ok?"✓":"○"}</i><span>${esc(c.t)}</span></li>`; }).join("");
      S.conclusion = ta.value; save();
    };
    ta.oninput = paint; paint();
    $$("[data-chip]").forEach(b => b.onclick = () => { const t = CHIPS[+b.dataset.chip]; ta.value = (ta.value.trim() ? ta.value.replace(/\s*$/, " ") : "") + t + " "; ta.focus(); paint(); });
    $("#wModel").onclick = () => {
      A.click();
      $("#wfb").innerHTML = `<div class="verdict" style="border:1px solid var(--line);background:var(--deep)"><b>Ejemplo de conclusión</b><span>${esc(MODEL)}</span><span class="src">Usalo como guía y escribilo con tus palabras: así practicás la redacción y evitás copiar.</span><div style="margin-top:8px"><button class="btn ghost" type="button" id="wUse">Copiar el ejemplo al cuadro para editarlo</button></div></div>`;
      $("#wUse").onclick = () => { ta.value = MODEL; paint(); ta.focus(); };
    };
    $("#wCheck").onclick = () => {
      const w = words(), miss = CHECKS.filter(c => !c.f(ta.value, w));
      if(!miss.length){
        A.fanfare(); S.conclusion = ta.value.trim(); save();
        $("#wfb").innerHTML = `<div class="verdict ok"><b>Conclusión lista</b><span>Responde la pregunta, se apoya en fuentes que coinciden y reconoce sus límites. Va a quedar guardada en tu expediente.</span></div><div style="margin-top:10px"><button class="btn" type="button" id="wDone">Reclamar la insignia</button></div>`;
        $("#wDone").onclick = () => earnBadge("cuarta", "¡Felicidades, has superado el desafío 4!", "grado", "Ver la ceremonia");
        $("#wDone").focus();
      } else {
        A.bad();
        $("#wfb").innerHTML = `<div class="verdict no"><b>Te falta ajustar ${miss.length === 1 ? "un punto" : miss.length + " puntos"}</b><ul class="explain">${miss.map(c=>`<li class="no"><i>○</i><span>${esc(c.tip)}</span></li>`).join("")}</ul><span class="src">Si te trabás, tocá «Ver un ejemplo».</span></div>`;
      }
    };
  };
  show();
};

/* ---------- Autoevaluación ---------- */
/* AUTO: preguntas de la autoevaluación. La primera opción de cada una es la
   correcta; el juego las mezcla al mostrarlas. ch = qué conviene repasar. */
const AUTO = [
  {ch:"Desafío 1", q:"¿En qué orden se trabaja un dato cualitativo?", o:["Segmentar, codificar y agrupar en categorías","Agrupar, segmentar y codificar","Interpretar, codificar y concluir","Codificar, concluir y segmentar"], why:"Primero se separa el fragmento útil, luego se le pone una etiqueta (código) y al final se agrupan las etiquetas parecidas en categorías."},
  {ch:"Desafío 1", q:"El tema es nuevo y casi no hay estudios previos. ¿Qué categorías conviene usar?", o:["Emergentes, que surgen al trabajar los datos","A priori, definidas antes de ir al campo","Ninguna: basta con contar las pistas","Las que usó otra investigación, sin cambios"], why:"Las categorías emergentes convienen cuando el tema es nuevo. Las a priori se usan con objetivos acotados y antecedentes suficientes."},
  {ch:"Desafío 1", q:"Un fragmento valioso no encaja en ninguna categoría. ¿Qué conviene hacer?", o:["Revisar el sistema y valorar una categoría nueva","Descartarlo para no ensuciar el análisis","Forzarlo en la categoría más parecida","Dejarlo para otra investigación"], why:"Si una unidad valiosa no alimenta ninguna categoría, hay que revisar el sistema: puede ser el comienzo de una categoría emergente."},
  {ch:"Desafío 2", q:"Dos personas codifican el mismo texto por separado. ¿Qué valor de kappa se espera como mínimo?", o:["0,80 o más","0,20","0,50","Exactamente 1,00"], why:"Cáceres (2003) espera un kappa de 0,80 o más. Si queda por debajo, hay que revisar las reglas y los códigos."},
  {ch:"Desafío 3", q:"¿Cuál de estas frases es un resultado y no una interpretación?", o:["«Se registraron seis fragmentos de percepción de inseguridad.»","«Hay más inseguridad porque el Estado no vigila.»","«La causa del saqueo es la pobreza.»","«La comunidad está abandonada.»"], why:"Un resultado dice qué se encontró, en pasado y sin explicarlo. Las otras frases explican el porqué, y eso va en la discusión."},
  {ch:"Desafío 4", q:"¿Qué es triangular un hallazgo?", o:["Contrastarlo con fuentes independientes que coinciden","Repetirlo en tres párrafos del informe","Preguntarle tres veces a la misma persona","Elegir las tres fuentes más famosas"], why:"Triangular es contrastar el hallazgo con otras fuentes obtenidas de forma independiente. Una fuente que repite a otra no cuenta como segunda."},
  {ch:"Repositorio 4", q:"¿Cuál es la regla de una buena conclusión?", o:["Responde la pregunta principal y no trae datos nuevos","Repite todos los resultados uno por uno","Agrega las últimas cifras encontradas","Propone qué debe hacer cada institución"], why:"La conclusión responde la pregunta y los objetivos sin introducir datos nuevos. Qué hacer corresponde a las recomendaciones."},
  {ch:"Repositorio 4", q:"¿Qué hace sólida a una recomendación?", o:["Sale de las conclusiones y dice qué, quién y cómo","Es general y se aplica a cualquier caso","Pide hacer más estudios algún día","Suena firme aunque no tenga relación con los datos"], why:"Una recomendación específica y realista sale de las conclusiones y señala qué hacer, quién lo hace y cómo."}
];
/* Autoevaluación: 7–8 aciertos = dominio sólido, 5–6 = buen avance, menos = repasar. */
R.auto = () => {
  let i = 0; const miss = []; let score = 0;
  stage.innerHTML = `<section class="screen"><div class="g3 wrap">
    <div style="display:grid;gap:6px"><p class="eyebrow">Autoevaluación · Regreso del viaje</p><h2>¿Qué aprendiste?</h2>
    <p class="muted">Ocho preguntas sobre lo que practicaste. No suma insignias: sirve para saber qué conviene repasar.</p></div>
    <div class="progress"><i id="ap" style="width:0%"></i></div>
    <h3 id="aq" style="font-size:20px;font-family:var(--f-body);font-weight:700;line-height:1.35"></h3>
    <div class="opts" id="ao"></div><div id="afb"></div></div></section>`;
  const show = () => {
    const Q = AUTO[i];
    const opts = Q.o.map((t,k)=>({t, ok:k===0})).sort(()=>Math.random()-.5);
    $("#ap").style.width = (i/AUTO.length*100)+"%";
    $("#aq").textContent = `${i+1}. ${Q.q}`; $("#afb").innerHTML = "";
    $("#ao").innerHTML = opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}"><span class="k">${String.fromCharCode(65+k)}</span><span>${esc(o.t)}</span></button>`).join("");
    $$("#ao .opt").forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k]; $$("#ao .opt").forEach(x=>x.disabled = true);
      if(o.ok){ score++; A.ok(); b.classList.add("right"); } else { A.bad(); b.classList.add("wrong"); if(!miss.includes(Q.ch)) miss.push(Q.ch); $$("#ao .opt").forEach((x,k)=>{ if(opts[k].ok) x.classList.add("right"); }); }
      $("#afb").innerHTML = `<div class="verdict ${o.ok?"ok":"no"}"><b>${o.ok?"Correcto":"Para repasar"} · ${esc(Q.ch)}</b><span>${esc(Q.why)}</span></div><div style="margin-top:10px"><button class="btn" type="button" id="aN">${i<AUTO.length-1?"Siguiente pregunta":"Ver mi resultado"}</button></div>`;
      $("#aN").onclick = () => { A.click(); i++; if(i < AUTO.length) show(); else finish(); }; $("#aN").focus();
    });
  };
  const finish = () => {
    S.auto = {score, total:AUTO.length, miss}; save();
    const lvl = score >= 7 ? "Dominio sólido" : score >= 5 ? "Buen avance" : "Conviene repasar";
    $("#ap").style.width = "100%";
    stage.querySelector(".g3").innerHTML = `<div style="display:grid;gap:8px"><p class="eyebrow">Autoevaluación · Resultado</p><h2>${score} de ${AUTO.length} · ${lvl}</h2>
      <p class="muted" style="max-width:62ch">${miss.length ? "Te conviene volver a mirar: " + miss.join(", ") + ". Los repositorios del reloj siguen disponibles desde el selector de capítulos." : "No fallaste ninguna. Cada paso del método quedó claro."}</p></div>
      <div><button class="btn" type="button" id="aEnd">Ver mi expediente</button></div>`;
    $("#aEnd").onclick = () => go("end");
  };
  show();
};

};

/* ============ Arranque ============ */
/* start(): punto de entrada. Carga el avance guardado y abre la primera
   pantalla (las instrucciones). Si el entorno trae datos en caliente, los usa. */
function start(data){
  const saved = (data && data.state) || load();
  if(saved) S = Object.assign(fresh(), saved, {settings:Object.assign(fresh().settings, saved.settings||{})});
  window.claude?.hot?.snapshot?.(() => ({state:S}));
  go(data && data.state ? S.stage : "cmds");
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
