<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kinética 3D Moín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: una sola "app" a pantalla completa; HUD arriba, escenario al centro, reloj flotante abajo a la derecha.
   Mundo visual: noche del Caribe + destello neón del reloj Kinética + atardecer de Moín. Tema oscuro deliberado. */
:root{
  --abyss:#06131b; --deep:#0c2431; --panel:#10303f; --line:#24505f;
  --neon:#3df58e; --neon-dim:#1d8d55; --sunset:#ff8f45; --alert:#ff5466;
  --text:#e5f3ef; --muted:#93b4ae; --sand:#ecd7a8; --ink:#04100a;
  --f-display:"Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1;letter-spacing:.01em}
p{margin:0}
a{color:var(--neon)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--neon)}
.muted{color:var(--muted)}
.wrap{padding-left:var(--gut-l);padding-right:var(--gut-r)}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;align-items:center;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a1f2a,#071820);z-index:5}
#hud .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
#hud .brand:hover b{text-shadow:0 0 12px var(--neon)}
#hud .brand b{font-family:var(--f-display);font-size:18px;letter-spacing:.06em;color:var(--neon)}
#hud .brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;color:var(--text)}
.hbtn:hover{border-color:var(--neon);color:var(--neon)}
.hbtn svg{width:16px;height:16px}
@media (max-width:620px){.hbtn .lbl{display:none}}
#stage{flex:1;position:relative;overflow-y:auto;overflow-x:hidden}
.screen{min-height:100%;position:relative;animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:.0}to{opacity:1}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:6px;padding:12px 20px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;cursor:pointer;background:var(--neon);color:var(--ink);box-shadow:0 0 0 1px var(--neon),0 0 24px -6px var(--neon)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--neon);color:var(--neon)}
.btn.sun{background:var(--sunset);box-shadow:0 0 0 1px var(--sunset),0 0 24px -6px var(--sunset)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- Escritorio ---------- */
.desk{position:absolute;inset:0;background:
  radial-gradient(1200px 600px at 75% 20%,rgba(61,245,142,.10),transparent 60%),
  radial-gradient(900px 500px at 10% 90%,rgba(255,143,69,.10),transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 40px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 40px),#081a24;display:flex;flex-direction:column}
.desk-body{flex:1;position:relative;display:grid;place-items:center;padding-block:24px}
.icons{position:absolute;top:20px;left:var(--gut-l);display:flex;flex-direction:column;gap:18px}
.dicon{width:84px;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-size:12px;color:var(--text);padding:6px;border-radius:6px}
.dicon:hover,.dicon:focus-visible{background:rgba(61,245,142,.12)}
.dicon svg{width:44px;height:44px}
.win{width:min(560px,calc(100% - 32px));background:#0d2532;border:1px solid var(--line);border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.win-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0a1e28;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.win-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.win-body{padding:28px 28px 26px;display:grid;gap:16px}
.win-body h1{font-size:clamp(28px,5vw,40px)}
.win-body h1 em{font-style:normal;color:var(--neon);display:block;font-size:1.25em}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.taskbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;background:#06141c;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.where{font-family:var(--f-mono);font-size:13px;color:var(--sunset)}

/* ---------- Cine (video / mensajes) ---------- */
.cine{position:absolute;inset:0;overflow:hidden;background:#000}
.cine .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-1%)}}
.cine::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 4px),
  radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.65))}
.cine.glitch .bg{animation:kb 40s ease-in-out infinite alternate,glitch 5s steps(1) infinite}
@keyframes glitch{0%,92%,100%{filter:none;clip-path:none}93%{filter:hue-rotate(40deg) saturate(1.6);transform:translateX(-8px) scale(1.06)}95%{clip-path:inset(30% 0 40% 0);transform:translateX(10px) scale(1.06)}97%{filter:contrast(1.6)}}
.cine.dusk .bg{filter:sepia(.45) saturate(1.3) hue-rotate(-20deg) brightness(.85)}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-block:20px 22px;background:linear-gradient(180deg,transparent,rgba(3,10,14,.92) 30%)}
.cap-inner{max-width:860px;margin:0 auto;display:grid;gap:12px}
.cap .who{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.cap .txt{font-size:clamp(17px,2.2vw,22px);line-height:1.5;min-height:4.5em;text-shadow:0 1px 2px #000}
.cap .ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cap .ctrl .sp{flex:1}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
.dots i.on{background:var(--neon)}
.rec{position:absolute;top:16px;left:var(--gut-l);z-index:2;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;background:rgba(0,0,0,.55);border:1px solid var(--line);padding:6px 10px;border-radius:4px;display:flex;gap:8px;align-items:center}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--alert);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- Selección ---------- */
.select{padding-block:28px 40px;max-width:1100px;margin:0 auto;display:grid;gap:22px}
.select h2{font-size:clamp(26px,4vw,40px)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:720px){.cards{grid-template-columns:1fr}}
.pc{position:relative;display:grid;grid-template-rows:auto auto;gap:10px;background:linear-gradient(180deg,#0f3242,#0a2230);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
.pc:hover{transform:translateY(-3px);border-color:var(--neon)}
.pc[aria-pressed="true"]{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 40px -10px var(--neon)}
.pc .art{height:260px;display:grid;place-items:end center;background:radial-gradient(closest-side,rgba(61,245,142,.16),transparent);border-radius:8px}
.pc .art img{max-height:250px;width:auto;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5))}
@media (max-width:720px){.pc{grid-template-columns:120px 1fr;grid-template-rows:auto;align-items:center}.pc .art{height:150px}.pc .art img{max-height:145px}}
.pc .code{font-family:var(--f-mono);font-size:12px;color:var(--neon)}
.pc h3{font-size:22px}
.pc p{color:var(--muted);font-size:14px}

/* ---------- Mapa ---------- */
.mapscr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;padding-block:20px 90px;max-width:1300px;margin:0 auto;align-items:start}
@media (max-width:860px){.mapscr{grid-template-columns:1fr}}
.mapbox{position:relative;background:radial-gradient(ellipse at 60% 40%,#0f3a4c,#071923 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .lbl{font-family:var(--f-mono);font-size:22px;fill:var(--muted);letter-spacing:.2em}
.mk{cursor:pointer}
.mk .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.mk text{font-family:var(--f-mono);font-size:20px;fill:var(--text)}
.mk.locked{cursor:default}
.mk.locked text{fill:var(--muted)}
.casecard{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:12px}
.casecard h2{font-size:clamp(22px,3vw,30px)}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.tag.live{border-color:var(--neon-dim);color:var(--neon)}
.tag.sun{border-color:var(--sunset);color:var(--sunset)}
.others{display:grid;gap:8px}
.others div{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.mapbar{display:flex;flex-wrap:wrap;gap:10px}

/* ---------- Exploración ---------- */
.explore{padding-block:18px 100px;max-width:1240px;margin:0 auto;display:grid;gap:14px}
.ex-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.ex-head h2{font-size:clamp(22px,3.4vw,34px)}
.ex-head p.muted{max-width:62ch;font-size:15px}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:8px 12px;white-space:nowrap}
.counter b{color:var(--neon);font-size:18px}
.scene{position:relative;width:min(100%, max(560px, calc((100dvh - 250px) * 16 / 9)));margin-inline:auto;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0a2230;max-width:100%}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px solid var(--neon);background:rgba(4,16,10,.35);cursor:pointer;display:grid;place-items:center;padding:0;z-index:3}
.hs::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--neon);animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.hs svg{width:20px;height:20px;color:var(--neon)}
.hs .hl{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--f-mono);font-size:11px;background:rgba(4,16,10,.85);border:1px solid var(--neon-dim);padding:3px 7px;border-radius:4px;opacity:0;transition:opacity .15s;pointer-events:none}
.hs:hover .hl,.hs:focus-visible .hl{opacity:1}
.hs.done{border-color:var(--sunset);background:rgba(255,143,69,.25)}
.hs.done::before{display:none}
.hs.done svg{color:var(--sunset)}
@media (max-width:620px){.hs{width:32px;height:32px}.hs svg{width:15px;height:15px}}
.player{position:absolute;height:24%;width:auto;transform:translate(-50%,-100%);transition:left .9s ease-in-out,top .9s ease-in-out;z-index:2;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));pointer-events:none}
.player.flip{transform:translate(-50%,-100%) scaleX(-1)}
.player.walk{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{margin-top:-6px}}
.chiplist{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--deep);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--neon)}
.chip .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--neon)}
.chip.done{color:var(--muted)}
.chip.done .st{background:var(--sunset);border-color:var(--sunset)}
.unlock{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;border:1px solid var(--neon);background:linear-gradient(90deg,rgba(61,245,142,.12),transparent);border-radius:10px;padding:14px 90px 14px 16px}

/* ---------- Modal / hojas ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(2,8,12,.72);backdrop-filter:blur(3px);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--deep);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .25s ease both}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:20px;flex:1;min-width:0}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;flex:none}
.x:hover{border-color:var(--neon)}
.sheet-b{padding:18px;display:grid;gap:14px}
.sheet-f{padding:0 18px 18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.quote{font-size:17px;border-left:3px solid var(--sunset);padding-left:12px}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.refl{display:grid;gap:4px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.refl p.src{font-family:inherit;font-size:12.5px;line-height:1.45;padding-left:1.4em;text-indent:-1.4em}
.scan{position:relative;border:1px solid var(--neon-dim);border-radius:10px;padding:16px;background:linear-gradient(180deg,rgba(61,245,142,.08),rgba(61,245,142,.02));display:grid;gap:10px;overflow:hidden}
.scan.run::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,rgba(61,245,142,.35),transparent);animation:sweep 1.1s ease-in-out 2}
@keyframes sweep{to{top:100%}}
.scan h4{margin:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--neon)}
.newsp{background:#efe6cf;color:#1f1a12;border-radius:6px;padding:16px;font-family:Georgia,"Times New Roman",serif;display:grid;gap:8px}
.newsp .mast{font-family:var(--f-display);letter-spacing:.2em;font-size:12px;border-bottom:2px solid #1f1a12;padding-bottom:4px}
.newsp h4{margin:0;font-size:22px;line-height:1.15}
.newsp p{font-size:15px}
.reward{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}
@media (max-width:520px){.reward{grid-template-columns:1fr;justify-items:center;text-align:center}}
.reward svg{width:120px;height:120px}
.kv{display:grid;gap:10px}
.kv div{display:grid;gap:2px}
.kv b{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon)}
.glowin{animation:glowin 1.2s ease both}
@keyframes glowin{0%{filter:drop-shadow(0 0 0 var(--neon));transform:scale(.6) rotate(-10deg);opacity:0}60%{filter:drop-shadow(0 0 22px var(--neon));transform:scale(1.08)}100%{filter:drop-shadow(0 0 10px var(--neon));transform:none;opacity:1}}

/* ---------- Reloj ---------- */
#watchBtn{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:68px;height:68px;border-radius:50%;border:0;background:#071a12;cursor:pointer;box-shadow:0 0 0 2px var(--neon-dim),0 8px 24px rgba(0,0,0,.5);display:grid;place-items:center;padding:0}
#watchBtn svg{width:68px;height:68px}
#watchBtn .wcount{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--neon)}
#watchBtn.buzz{animation:buzz .12s linear 10,glowpulse 1.6s ease-in-out 3}
@keyframes buzz{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
@keyframes glowpulse{50%{box-shadow:0 0 0 2px var(--neon),0 0 40px 6px var(--neon)}}
.wtabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 18px}
.wtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 6px;cursor:pointer;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wtabs button[aria-selected="true"]{color:var(--neon);border-color:var(--neon)}
.clue{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:4px}
.clue b{font-family:var(--f-display);font-size:16px}
.clue p{font-size:14px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:480px){.badges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.badge{display:grid;justify-items:center;gap:6px;text-align:center;font-size:13px}
.badge svg{width:72px;height:72px}
.badge.off{opacity:.35}
.progress{height:8px;border-radius:4px;background:#0a1d26;border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--neon);box-shadow:0 0 12px var(--neon);transition:width .5s}

/* ---------- Repositorio ---------- */
.repo{padding-block:20px 100px;max-width:1150px;margin:0 auto;display:grid;gap:16px}
.repo h2{font-size:clamp(22px,3.4vw,34px)}
.repo-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.repo-grid{grid-template-columns:1fr}}
.files{display:grid;gap:8px}
.file{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.file:hover{border-color:var(--neon)}
.file[aria-current="true"]{border-color:var(--neon);background:#103a33}
.file small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.file .rd{font-family:var(--f-mono);font-size:11px;color:var(--sunset)}
.viewer{background:#0a1d27;border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px;min-height:260px}
.viewer h3{font-size:22px}
.viewer p{max-width:68ch}
.phrase{border:1px solid var(--neon);border-radius:10px;padding:18px;display:grid;gap:12px;background:linear-gradient(135deg,rgba(61,245,142,.10),transparent)}
.phrase q{font-family:var(--f-display);font-size:clamp(20px,3vw,28px);quotes:"«" "»"}

/* ---------- Minijuego 1 ---------- */

/* ============ Audio (música generada + efectos) ============ */
const A = {
  ctx:null, master:null, music:null, sfx:null, timer:null, step:0, ocean:null,
  init(){
    if(this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = S.settings.vol; this.master.connect(this.ctx.destination);
      this.music = this.ctx.createGain(); this.music.gain.value = S.settings.music ? .55 : 0; this.music.connect(this.master);
      this.sfx = this.ctx.createGain(); this.sfx.gain.value = S.settings.sfx ? .9 : 0; this.sfx.connect(this.master);
      this.lp = this.ctx.createBiquadFilter(); this.lp.type = "lowpass"; this.lp.frequency.value = 1400; this.lp.connect(this.music);
      this.startLoop();
    }catch(e){ this.ctx = null; }
  },
  resume(){ this.init(); if(this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  chords:[[110,130.81,164.81],[87.31,110,130.81],[130.81,164.81,196],[98,123.47,146.83]],
  startLoop(){
    const tick = () => {
      if(!this.ctx) return;
      const t = this.ctx.currentTime + .05;
      const ch = this.chords[Math.floor(this.step/8)%4];
      if(this.step % 8 === 0) ch.forEach(f => this.pad(f*2, t, 4.2));
      const notes = [ch[0]*4, ch[1]*4, ch[2]*4, ch[1]*4, ch[0]*8, ch[2]*4, ch[1]*4, ch[2]*2*2];
      if(this.step % 2 === 0 || Math.random() < .3) this.pluck(notes[this.step%8], t);
      this.step++;
    };
    this.timer = setInterval(tick, 520);
  },
  pad(f, t, d){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "triangle"; o.frequency.value = f; o.detune.value = (Math.random()-.5)*12;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.07, t+1.4); g.gain.linearRampToValueAtTime(0, t+d);
    o.connect(g); g.connect(this.lp); o.start(t); o.stop(t+d+.1);
  },
  pluck(f, t){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.05, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+.9);
    o.connect(g); g.connect(this.lp); o.start(t); o.stop(t+1);
  },
  setOcean(on){
    if(!this.ctx) return;
    if(on && !this.ocean){
      const len = this.ctx.sampleRate*2, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 500;
      const g = this.ctx.createGain(); g.gain.value = .05;
      const lfo = this.ctx.createOscillator(), lg = this.ctx.createGain(); lfo.frequency.value = .12; lg.gain.value = .04; lfo.connect(lg); lg.connect(g.gain);
      src.connect(f); f.connect(g); g.connect(this.music); src.start(); lfo.start();
      this.ocean = {src, lfo};
    } else if(!on && this.ocean){ try{ this.ocean.src.stop(); this.ocean.lfo.stop(); }catch(e){} this.ocean = null; }
  },
  tone(f, d=.15, type="sine", v=.2, when=0, slide){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + when, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t+d+.05);
  },
  click(){ this.tone(900,.05,"square",.05); },
  scan(){ this.tone(300,1.1,"sawtooth",.05,0,1600); this.tone(1200,.12,"sine",.12,1.15); },
  ok(){ this.tone(660,.12,"triangle",.18); this.tone(990,.2,"triangle",.18,.1); },
  bad(){ this.tone(180,.25,"square",.08); },
  buzz(){ for(let i=0;i<5;i++) this.tone(110,.08,"square",.08,i*.12); try{ navigator.vibrate && navigator.vibrate([90,60,90,60,140]); }catch(e){} },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.35,"triangle",.16,i*.13)); },
  apply(){
    if(!this.ctx) return;
    this.master.gain.value = S.settings.vol;
    this.music.gain.value = S.settings.music ? .55 : 0;
    this.sfx.gain.value = S.settings.sfx ? .9 : 0;
  }
};

/* ============ Voz (locución) ============ */
const V = {
  voice:null,
  pick(){ try{ const vs = speechSynthesis.getVoices(); this.voice = vs.find(v=>/es[-_](CR|MX|US|419)/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null; }catch(e){} },
  say(text, opt={}){
    if(!S.settings.voice || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[«»]/g,""));
      if(!this.voice) this.pick();
      if(this.voice) u.voice = this.voice;
      u.lang = this.voice ? this.voice.lang : "es-ES";
      u.pitch = opt.pitch ?? 1; u.rate = opt.rate ?? 1;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  stop(){ try{ speechSynthesis.cancel(); }catch(e){} }
};
try{ speechSynthesis.onvoiceschanged = () => V.pick(); }catch(e){}

function toast(msg, ms=2600){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden = true, ms); }
function openModal(html, onClose){
  const m = $("#modal"); m.innerHTML = html; m.hidden = false;
  const close = () => { m.hidden = true; m.innerHTML = ""; V.stop(); onClose && onClose(); };
  m.onclick = e => { if(e.target === m) close(); };
  $$("[data-close]", m).forEach(b => b.onclick = close);
  const f = m.querySelector("button, a, input, select"); f && f.focus();
  return close;
}
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#modal").hidden){ const c = $("#modal [data-close]"); c && c.click(); } });

/* Narrador: escribe párrafos uno a uno con botón Siguiente; lee en voz alta si está activo */
function narrate(root, {who, paras, voice={}, endLabel, onEnd}){
  let i = 0, typing = false, skipType = false;
  root.innerHTML = `<div class="cap wrap"><div class="cap-inner">
     <div class="who">${esc(who)}</div><div class="txt" aria-live="polite"></div>
     <div class="ctrl"><div class="dots">${paras.map(()=>"<i></i>").join("")}</div><span class="sp"></span>
       <button class="btn ghost" type="button" data-skip>Saltar</button><button class="btn" type="button" data-next>Siguiente</button></div></div></div>`;
  const txt = $(".txt", root), next = $("[data-next]", root), skip = $("[data-skip]", root);
  async function show(){
    $$(".dots i", root).forEach((d,k)=>d.classList.toggle("on", k<=i));
    const p = paras[i]; txt.textContent = ""; typing = true; skipType = false;
    V.say(p, voice);
    next.textContent = i === paras.length-1 ? (endLabel||"Continuar") : "Siguiente";
    for(let c=0;c<p.length;c++){ if(skipType){ txt.textContent = p; break; } txt.textContent += p[c]; if(c%3===0) await sleep(speedMs()*3); }
    typing = false;
  }
  next.onclick = () => { A.click(); if(typing){ skipType = true; return; } if(i < paras.length-1){ i++; show(); } else { V.stop(); onEnd(); } };
  skip.onclick = () => { V.stop(); skipType = true; onEnd(); };
  show();
}

const R = {};
const ZONE_IDS = ["lideresa","herramientas","lora","rotulo","periodico","perro"];
const secDone = () => ZONE_IDS.every(id => S.clues[id]);
const repoDone = () => !!S.read.repo1;
const gameDone = () => S.badges.includes("conocimiento");
function updateWatch(){
  const n = ZONE_IDS.filter(id => S.clues[id]).length;
  $("#hCount").textContent = `${n}/${ZONE_IDS.length}`;
  const st = !secDone() ? ["Paso 1 de 3 · Información secundaria", `Investigá los elementos con rombo verde (${n} de ${ZONE_IDS.length})`]
    : !repoDone() ? ["Paso 2 de 3 · El reloj vibró", "Buscá a la archivista de Kinética (rombo naranja)"]
    : !gameDone() ? ["Paso 3 de 3 · Desafío desbloqueado", "Hablá con el agente de desafío (rombo celeste)"]
    : ["Zona completa", "Insignia de Conocimiento obtenida. Podés seguir explorando."];
  $("#gStep").textContent = st[0]; $("#gText").textContent = st[1];
  if(typeof refreshMarkers === "function") refreshMarkers();
}
function buzzWatch(){ A.buzz(); const b = $("#hWatch"); b.animate([{transform:"translateX(0)"},{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"translateX(0)"}],{duration:120,iterations:8}); }
function openPanel(){ $("#panel").hidden = false; $("#panel").scrollTop = 0; stage.innerHTML = ""; }
function closePanel(){ $("#panel").hidden = true; stage.innerHTML = ""; document.body.classList.remove("ingame"); }
function go(st){
  A.click(); V.stop();
  $("#modal").hidden = true; $("#modal").innerHTML = "";
  if(st === "explore1"){ closePanel(); updateWatch(); return; }
  if(st === "explore2") st = "fin3d";
  openPanel(); document.body.classList.toggle("ingame", /^game/.test(st));
  (R[st] || R.fin3d)();
}

function openClue(id, onDone){
  const c = CLUES[id];
  const already = !!S.clues[id];
  const isTalk = !!c.who;
  const body = c.news
    ? `<div class="newsp"><div class="mast">EL ECO DE MOÍN · ARCHIVO</div><h4>${esc(c.lines[0])}</h4>${c.lines.slice(1).map(l=>`<p>${esc(l)}</p>`).join("")}</div>`
    : c.lines.map(l => `<p class="${l.startsWith("«")?"quote":""}">${esc(l)}</p>`).join("");
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(c.title)}">
    <div class="sheet-h"><h3>${esc(c.title)}</h3><span class="tag sun">${esc(c.tag)}</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
    <div class="sheet-b">${body}
      <div class="scan" id="scanBox" ${already?"":"hidden"}><h4>Registro del reloj</h4><p>${esc(c.scan)}</p>${(c.refs||[]).length?`<div class="refl"><span class="src">Referencias (APA 7)</span>${c.refs.map(k=>`<p class="src">${REFS[k]}</p>`).join("")}</div>`:(c.src?`<span class="src">Fuente: ${esc(c.src)}</span>`:"")}</div></div>
    <div class="sheet-f">${already?`<button class="btn ghost" type="button" data-close>Cerrar</button>`:`<button class="btn" type="button" id="doScan">${esc(c.action)}</button>`}</div></div>`);
  if(isTalk) V.say(c.lines.join(" "), {pitch:1, rate:1.02});
  const b = $("#doScan");
  if(b) b.onclick = async () => {
    b.disabled = true; A.scan();
    const box = $("#scanBox"); box.hidden = false; box.classList.add("run"); box.querySelector("p").style.opacity = .15;
    await sleep(1300);
    box.classList.remove("run"); box.querySelector("p").style.opacity = 1;
    S.clues[id] = true; save(); updateWatch(); A.ok();
    b.outerHTML = `<button class="btn" type="button" data-close>Guardado en el reloj</button>`;
    const fin = () => { $("#modal").hidden = true; $("#modal").innerHTML = ""; V.stop(); onDone(); };
    $("#modal .sheet-f [data-close]").onclick = fin;
    $("#modal .sheet-h [data-close]").onclick = fin;
    $("#modal .sheet-f [data-close]").focus();
    $("#modal").onclick = e => { if(e.target.id === "modal") fin(); };
  };
}

function makeRoad(points, width, color){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], 0, p[1])));

  for(let i=0;i<=N;i++){
    const t = i/N, p = curve.getPoint(t), d = curve.getTangent(t);
    const nx = -d.z, nz = d.x, l = Math.hypot(nx,nz) || 1;
    pos.push(p.x + nx/l*width/2, .03, p.z + nz/l*width/2, p.x - nx/l*width/2, .03, p.z - nz/l*width/2);
    if(i<N){ const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color, side:THREE.DoubleSide})); m.receiveShadow = true; scene.add(m);
  return curve;
}

let near = null;
function interact(i){
  if(!i || blocked()) return;
  A.click(); keys.w = keys.a = keys.s = keys.d = keys.arrowup = keys.arrowdown = keys.arrowleft = keys.arrowright = false;
  if(i.kind === "clue"){
    const was = secDone();
    openClue(i.id, () => {
      updateWatch();
      if(!was && secDone()){ buzzWatch(); toast("El reloj vibra: la archivista de Kinética te espera (rombo naranja)", 4200); }
    });
    return;
  }
  if(i.kind === "repo"){

/* ---------- Bucle ---------- */
function collide(p){
  const pr = .42;
  for(const o of world.obs){
    if(o.t === "c"){ const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + pr; if(d < m && d > 1e-4){ p.x = o.x + dx/d*m; p.z = o.z + dz/d*m; } }
    else { const x1 = o.x1 - pr, x2 = o.x2 + pr, z1 = o.z1 - pr, z2 = o.z2 + pr;
      if(p.x > x1 && p.x < x2 && p.z > z1 && p.z < z2){ const dl = p.x - x1, dr = x2 - p.x, dt = p.z - z1, db = z2 - p.z, mn = Math.min(dl,dr,dt,db);
        if(mn === dl) p.x = x1; else if(mn === dr) p.x = x2; else if(mn === dt) p.z = z1; else p.z = z2; } }
  }
  p.x = Math.max(-29, Math.min(29, p.x)); p.z = Math.max(-31, Math.min(38, p.z));
}
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
let frame = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  frame++;
  if(!$("#panel").hidden) return;
  if(blocked() && frame % 4) return;
  if(player && !blocked()){
    let fx = (keys.w||keys.arrowup?1:0) - (keys.s||keys.arrowdown?1:0) + joy.y;
    let rx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0) + joy.x;
    const mag = Math.min(1, Math.hypot(fx, rx));
    if(mag > .08){
      const n = Math.hypot(fx, rx); fx /= n; rx /= n;
      const speed = (keys.shift ? 9 : 5.5) * mag;
      const fwd = [-Math.sin(yaw), -Math.cos(yaw)], right = [Math.cos(yaw), -Math.sin(yaw)];
      const p = {x: player.position.x + (fwd[0]*fx + right[0]*rx)*speed*dt, z: player.position.z + (fwd[1]*fx + right[1]*rx)*speed*dt};
      collide(p); placePlayer(p.x, p.z);
      if(Math.abs(rx) > .15) facing = rx > 0 ? 1 : -1;
      walkT += dt*speed*1.6; stepT += dt*speed;
      if(stepT > 2.6){ stepT = 0; A.tone && A.tone(140 + Math.random()*40, .05, "triangle", .035); }
    } else walkT = 0;
    player.position.y = Math.abs(Math.sin(walkT)) * .12;
    player.scale.x = 2.3*ASPECT[S.char ?? 0]*facing;
    // elemento más cercano
    let best = null, bd = 1e9;
    for(const i of world.inter){ const d = Math.hypot(i.x - player.position.x, i.z - player.position.z); if(d < i.r && d < bd){ best = i; bd = d; } }
    if(best !== near){
      near = best;
      $("#prompt").hidden = !near; if(near) $("#pText").textContent = near.label;
      $("#prompt kbd").textContent = TOUCH ? "●" : "E";
      $("#actBtn").disabled = !near; $("#actBtn").textContent = near ? (near.kind === "clue" ? (CLUES[near.id].who ? "Hablar" : "Investigar") : "Hablar") : "Acción";
    }
  } else if(blocked()){ if(!$("#prompt").hidden){ $("#prompt").hidden = true; near = null; $("#actBtn").disabled = true; } }
  // cámara en tercera persona
  if(player){
    camTarget.set(player.position.x, 1.3, player.position.z);
    const want = new THREE.Vector3(player.position.x + Math.sin(yaw)*camDist, camH, player.position.z + Math.cos(yaw)*camDist);
    camera.position.lerp(want, 1 - Math.pow(.0015, dt));
    camera.lookAt(camTarget);
    sun.position.set(player.position.x - 38, 34, player.position.z - 26); sun.target.position.set(player.position.x, 0, player.position.z);
  }
  for(const i of world.inter){ if(i.marker.visible){ i.marker.rotation.y = t*2; i.marker.position.y = i.top + .5 + Math.sin(t*3 + i.x)*.12; } }
  if(world.pedRing) world.pedRing.scale.setScalar(1 + Math.sin(t*2)*.05);
  if(world.lora) world.lora.position.y = 3.25 + Math.abs(Math.sin(t*1.7))*.05;
  for(let k=0;k<5;k++){ const f = world["foam"+k]; if(f){ f.position.z = -56.5 - k*2.4 + Math.sin(t*.8 + k)*.8; f.material.opacity = .3 + .25*Math.sin(t*.8 + k); } }
  renderer.render(scene, camera);
  if(!$("#mini").hidden && (Math.floor(t*12) % 2 === 0)) drawMini();
}
function drawMini(){
  const c = $("#mini").getContext("2d"), W = 300, sc = W/72, X = x => (x + 34)*sc, Z = z => (z + 33)*sc;
  c.clearRect(0,0,W,W); c.fillStyle = "rgba(91,138,58,.35)"; c.fillRect(0,0,W,W);
  c.fillStyle = "rgba(226,201,147,.6)"; c.fillRect(0, 0, W, Z(-26)); c.fillStyle = "rgba(42,127,168,.7)"; c.fillRect(0, 0, W, Math.max(0, Z(-30)));
  c.strokeStyle = "#b48553"; c.lineWidth = 4*sc/2.2; c.beginPath(); for(let i=0;i<=40;i++){ const p = world.road.getPoint(i/40); i ? c.lineTo(X(p.x), Z(p.z)) : c.moveTo(X(p.x), Z(p.z)); } c.stroke();
  c.fillStyle = "rgba(20,30,36,.75)"; for(const o of world.obs) if(o.t === "b") c.fillRect(X(o.x1), Z(o.z1), (o.x2-o.x1)*sc, (o.z2-o.z1)*sc);
  for(const i of world.inter){ if(!i.marker.visible) continue; c.fillStyle = "#" + i.marker.material.color.getHexString(); c.beginPath(); c.arc(X(i.x), Z(i.z), 9, 0, 7); c.fill(); }
  if(player){ const px = X(player.position.x), pz = Z(player.position.z); c.save(); c.translate(px, pz); c.rotate(-yaw); c.fillStyle = "#fff"; c.beginPath(); c.moveTo(0,-14); c.lineTo(9,10); c.lineTo(-9,10); c.closePath(); c.fill(); c.restore(); }
}
function applyQuality(){
  if(!renderer) return;
  const low = (S.settings.quality || (TOUCH ? "baja" : "alta")) === "baja";
  renderer.setPixelRatio(Math.min(devicePixelRatio, low ? 1 : 1.75));
  renderer.shadowMap.enabled = !low; sun.castShadow = !low;
  sun.shadow.mapSize.set(low ? 512 : 2048, low ? 512 : 2048); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  scene.traverse(o => { if(o.material){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  resize();
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }

async function boot(){
  try{ await Promise.race([document.fonts.ready, sleep(1500)]); }catch(e){}
  if(!window.THREE){ $("#loading3").textContent = "No se pudo cargar el motor 3D. Revisá la conexión y recargá la página."; return; }
  try{
    renderer = new THREE.WebGLRenderer({canvas:$("#gl"), antialias:true});
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  }catch(e){ $("#loading3").textContent = "Este dispositivo no permite gráficos 3D (WebGL)."; return; }
  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 400);
  if(innerWidth < innerHeight){ camDist = 13.5; camH = 9.5; }
  buildWorld(); applyQuality(); refreshMarkers(); updateWatch();
  camera.position.set(START.x, camH + 6, START.z + camDist + 8);
  addEventListener("resize", resize);
  $("#loading3").remove();
  $("#gl").tabIndex = 0;
  tick(); showStart();
  window.__k3d = {tp:(x,z)=>placePlayer(x,z), near:()=>near && near.id, S:()=>S};
}
boot();
})();
</script>
