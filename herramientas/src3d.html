<title>Kinética 3D Moín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/*@@CSS@@*/
/* ---------- Capa 3D: lienzo a pantalla completa, HUD encima, paneles para biblioteca y desafíos ---------- */
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#2b3a5a}
#hud3{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding-block:calc(10px + env(safe-area-inset-top,0px)) 10px;padding-left:var(--gut-l);padding-right:var(--gut-r);background:linear-gradient(180deg,rgba(4,14,20,.92),rgba(4,14,20,.0));pointer-events:none}
#hud3>*{pointer-events:auto}
#hud3 .brand{display:flex;align-items:center;gap:8px;background:rgba(6,19,27,.75);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
#hud3 .brand b{font-family:var(--f-display);letter-spacing:.06em;color:var(--neon);font-size:16px}
#hud3 .goal{flex:1;min-width:0;display:grid;gap:1px;background:rgba(6,19,27,.75);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
#hud3 .goal small{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--sunset)}
#hud3 .goal span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn3{display:inline-flex;align-items:center;gap:6px;background:rgba(6,19,27,.75);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--text)}
.hbtn3:hover{border-color:var(--neon)}
.hbtn3 svg{width:18px;height:18px}
.hbtn3 b{color:var(--neon)}
@media (max-width:620px){#hud3 .brand b{display:none}.hbtn3 .lbl{display:none}#hud3 .goal span{font-size:13px}}
#mini{position:fixed;left:var(--gut-l);top:calc(70px + env(safe-area-inset-top,0px));z-index:9;width:150px;height:150px;border-radius:12px;border:1px solid var(--line);background:rgba(6,19,27,.7)}
@media (max-width:620px){#mini{width:104px;height:104px}}
#prompt{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:10px;background:rgba(6,19,27,.88);border:1px solid var(--neon);border-radius:999px;padding:10px 18px 10px 10px;font-size:16px;cursor:pointer;box-shadow:0 0 24px -6px var(--neon);max-width:calc(100% - 32px)}
#prompt kbd{font-family:var(--f-mono);font-weight:600;background:var(--neon);color:var(--ink);border-radius:6px;padding:2px 9px}
@media (pointer:coarse){#prompt{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:11;width:132px;height:132px;border-radius:50%;background:rgba(6,19,27,.45);border:2px solid rgba(61,245,142,.45);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(61,245,142,.85);box-shadow:0 0 18px rgba(61,245,142,.6)}
#actBtn{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));z-index:11;width:96px;height:96px;border-radius:50%;border:0;background:var(--neon);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:15px;box-shadow:0 0 30px -4px var(--neon)}
#actBtn[disabled]{background:#24505f;color:#93b4ae;box-shadow:none}
#panel{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--abyss)}
#panel #stage{min-height:100%;overflow:visible;padding-top:env(safe-area-inset-top,0px)}
#panelBack{position:sticky;top:0;z-index:5;display:flex;justify-content:flex-end;padding-block:10px;background:linear-gradient(180deg,var(--abyss),rgba(6,19,27,0))}
#start{position:fixed;inset:0;z-index:40;overflow-y:auto;background:radial-gradient(1000px 600px at 70% 10%,rgba(61,245,142,.12),transparent 60%),rgba(4,12,18,.86);backdrop-filter:blur(4px)}
.st-wrap{max-width:1100px;margin:0 auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) 40px;display:grid;gap:20px}
.st-wrap h1{font-size:clamp(34px,6vw,64px)}
.st-wrap h1 em{font-style:normal;color:var(--neon)}
.ctrls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.ctrls{grid-template-columns:1fr}}
.ctrls div{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--deep);display:grid;gap:6px;font-size:15px}
.ctrls b{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon)}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cards3 .pc .art{height:200px}.cards3 .pc .art img{max-height:190px}
@media (max-width:720px){.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}.cards3 .pc{grid-template-columns:1fr;padding:10px}.cards3 .pc .art{height:120px}.cards3 .pc .art img{max-height:115px}.cards3 .pc p{display:none}}
#loading3{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--abyss);font-family:var(--f-mono);color:var(--neon)}
</style>

<canvas id="gl" aria-label="Comunidad de Moín en 3D"></canvas>
<header id="hud3" hidden>
  <button class="brand" id="hMenu" type="button" aria-label="Menú de Kinética">
    <svg width="22" height="22" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#3df58e" stroke-width="2"/><path d="M9 7v12M9 13l7-6M11 12l6 7" stroke="#3df58e" stroke-width="2" fill="none" stroke-linecap="round"/></svg><b>KINÉTICA</b>
  </button>
  <div class="goal" aria-live="polite"><small id="gStep">Paso 1 de 3</small><span id="gText">Investigá los elementos marcados</span></div>
  <button class="hbtn3" id="hWatch" type="button" aria-label="Abrir el reloj"><svg viewBox="0 0 24 24" fill="none" stroke="#3df58e" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 9v3l2 2M9 3h6M9 21h6"/></svg><span><b id="hCount">0/6</b></span></button>
  <button class="hbtn3" id="hSet" type="button" aria-label="Configuración"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
</header>
<canvas id="mini" width="300" height="300" aria-hidden="true" hidden></canvas>
<div id="prompt" role="button" tabindex="0" hidden><kbd>E</kbd><span id="pText"></span></div>
<div id="joy" hidden><div id="knob"></div></div>
<button id="actBtn" type="button" hidden disabled>Acción</button>
<div id="panel" hidden><div id="stage"></div></div>
<div id="start" hidden></div>
<div id="loading3">Cargando la comunidad de Moín…</div>
<div id="modal" hidden></div>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stage = $("#stage");

/* ============ Estado ============ */
const KEY = "kinetica-moin-3d-v1";
const fresh = () => ({char:null, clues:{}, read:{}, badges:[], items:["reloj"], settings:{music:true, sfx:true, voice:true, speed:"normal", vol:0.5}});
let S = fresh();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const t = localStorage.getItem(KEY); if(t){ const o = JSON.parse(t); return Object.assign(fresh(), o, {settings:Object.assign(fresh().settings, o.settings||{})}); } }catch(e){} return null; }
{ const o = load(); if(o) S = o; }

/*@@AUDIO@@*/
/*@@UI@@*/
/*@@ART@@*/
/*@@CLUES@@*/

const R = {};
const ZONE_IDS = ["lideresa","herramientas","lora","rotulo","periodico","perro"];
const secDone = () => ZONE_IDS.every(id => S.clues[id]);
const repoDone = () => !!S.read.repo1;
const gameDone = () => S.badges.includes("conocimiento");
function updateWatch(){
  const n = ZONE_IDS.filter(id => S.clues[id]).length;
  $("#hCount").textContent = `${n}/${ZONE_IDS.length}`;
  const st = !secDone() ? ["Paso 1 de 3 · Información secundaria", `Investigá los elementos con rombo verde (${n} de ${ZONE_IDS.length})`]
    : !repoDone() ? ["Paso 2 de 3 · El reloj vibró", "Buscá a la archivista de Kinética (rombo naranja)"]
    : !gameDone() ? ["Paso 3 de 3 · Desafío desbloqueado", "Hablá con el agente de desafío (rombo celeste)"]
    : ["Zona completa", "Insignia de Conocimiento obtenida. Podés seguir explorando."];
  $("#gStep").textContent = st[0]; $("#gText").textContent = st[1];
  if(typeof refreshMarkers === "function") refreshMarkers();
}
function buzzWatch(){ A.buzz(); const b = $("#hWatch"); b.animate([{transform:"translateX(0)"},{transform:"translateX(-3px)"},{transform:"translateX(3px)"},{transform:"translateX(0)"}],{duration:120,iterations:8}); }
function openPanel(){ $("#panel").hidden = false; $("#panel").scrollTop = 0; stage.innerHTML = ""; }
function closePanel(){ $("#panel").hidden = true; stage.innerHTML = ""; document.body.classList.remove("ingame"); }
function go(st){
  A.click(); V.stop();
  $("#modal").hidden = true; $("#modal").innerHTML = "";
  if(st === "explore1"){ closePanel(); updateWatch(); return; }
  if(st === "explore2") st = "fin3d";
  openPanel(); document.body.classList.toggle("ingame", /^game/.test(st));
  (R[st] || R.fin3d)();
}

/*@@OPENCLUE@@*/
/*@@REPOS@@*/
/*@@GAME1@@*/

R.fin3d = () => {
  const n = ZONE_IDS.filter(id => S.clues[id]).length;
  stage.innerHTML = `<section class="screen"><div class="endscr wrap">
    <div style="display:grid;gap:10px"><p class="eyebrow">Prototipo 3D · Zona 1</p><h2>Comunidad de Moín completa</h2>
    <p class="muted" style="max-width:62ch">Investigaste ${n} de ${ZONE_IDS.length} elementos, leíste la biblioteca y superaste La codificación de hallazgos. En la versión completa, el camino seguiría hacia la playa de día, El radar de la información y el resto del recorrido.</p></div>
    <div class="badges">${["conocimiento","rigurosidad","interpretacion","cuarta"].map(k => `<div class="badge ${S.badges.includes(k)?"":"off"}">${badgeSVG(k)}<span>${BADGES[k].name}</span></div>`).join("")}</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn" type="button" id="fBack">Seguir explorando</button><button class="btn ghost" type="button" id="fW">Ver mis hallazgos</button><button class="btn ghost" type="button" id="fR">Reiniciar prototipo</button></div>
  </div></section>`;
  $("#fBack").onclick = () => go("explore1");
  $("#fW").onclick = openWatch;
  $("#fR").onclick = e => { const b = e.currentTarget; if(b.dataset.armed){ resetAll(); } else { b.dataset.armed = "1"; b.textContent = "Tocá otra vez para confirmar"; } };
};

/* ============ Reloj, menú y configuración ============ */
function openWatch(){
  A.click();
  const list = ZONE_IDS.map(id => { const c = CLUES[id]; return S.clues[id]
    ? `<div class="clue"><b>${esc(c.title)}</b><p>${esc(c.short)}</p>${c.src?`<span class="src">Fuente: ${esc(c.src)}</span>`:""}</div>`
    : `<div class="clue" style="opacity:.45"><b>Sin investigar</b><p>Buscá un rombo verde en la comunidad.</p></div>`; }).join("");
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Reloj Kinética">
    <div class="sheet-h"><div style="width:40px;height:40px">${watchSVG(ZONE_IDS.filter(id=>S.clues[id]).length/ZONE_IDS.length)}</div><h3>Reloj Kinética</h3><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
    <div class="sheet-b"><div class="eyebrow">Comunidad · hallazgos</div>${list}
    <div class="eyebrow" style="margin-top:6px">Insignias</div><div class="badges">${["conocimiento","rigurosidad","interpretacion","cuarta"].map(k => `<div class="badge ${S.badges.includes(k)?"":"off"}">${badgeSVG(k)}<span>${BADGES[k].name}</span></div>`).join("")}</div></div></div>`);
}
function openSettings(){
  A.click(); const st = S.settings;
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Configuración">
   <div class="sheet-h"><h3>Configuración</h3><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
   <div class="sheet-b">
    <div class="set-row"><label for="sMusic">Música</label><input id="sMusic" class="switch" type="checkbox" ${st.music?"checked":""}></div>
    <div class="set-row"><label for="sSfx">Efectos de sonido<small>Pasos, escaneos y aciertos</small></label><input id="sSfx" class="switch" type="checkbox" ${st.sfx?"checked":""}></div>
    <div class="set-row"><label for="sVoice">Locución por voz</label><input id="sVoice" class="switch" type="checkbox" ${st.voice?"checked":""}></div>
    <div class="set-row"><label for="sQ">Calidad gráfica<small>Bajala si el juego va lento</small></label><select id="sQ"><option value="alta">Alta</option><option value="baja">Baja</option></select></div>
    <div class="set-row"><label>Reiniciar prototipo<small>Borra pistas, lecturas e insignias</small></label><button class="btn ghost" type="button" id="sReset">Reiniciar</button></div>
   </div></div>`);
  $("#sQ").value = st.quality || (TOUCH ? "baja" : "alta");
  $("#sMusic").onchange = e => { st.music = e.target.checked; A.resume(); A.apply(); save(); };
  $("#sSfx").onchange = e => { st.sfx = e.target.checked; A.apply(); save(); };
  $("#sVoice").onchange = e => { st.voice = e.target.checked; if(!st.voice) V.stop(); save(); };
  $("#sQ").onchange = e => { st.quality = e.target.value; save(); applyQuality(); };
  $("#sReset").onclick = e => { const b = e.currentTarget; if(b.dataset.armed){ resetAll(); } else { b.dataset.armed = "1"; b.textContent = "Tocá otra vez para confirmar"; } };
}
function openMenu(){
  A.click();
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Menú de Kinética">
    <div class="sheet-h"><h3>Kinética · Prototipo 3D</h3><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
    <div class="sheet-b menu-list">
      <button class="btn ghost" type="button" id="kmW">Información de hallazgos</button>
      <button class="btn ghost" type="button" id="kmC">Cambiar de personaje y ver controles</button>
      <button class="btn ghost" type="button" id="kmS">Configuración</button>
      <p class="src">Esta versión recorre la comunidad de Moín y el desafío 1. Tu avance se guarda en este navegador.</p>
      <p class="src">Profesor del curso: Cristian Alonso Silva Jiménez · Desarrollo: Luis Alonso Solórzano Vásquez · Curso 05477, UNED, en alianza con el PEM.</p>
    </div></div>`);
  $("#kmW").onclick = openWatch; $("#kmS").onclick = openSettings;
  $("#kmC").onclick = () => { $("#modal").hidden = true; showStart(); };
}
function resetAll(){ const keep = S.settings; S = fresh(); S.settings = keep; save(); closePanel(); $("#modal").hidden = true; placePlayer(START.x, START.z); updateWatch(); showStart(); }
$("#hWatch").onclick = openWatch; $("#hSet").onclick = openSettings; $("#hMenu").onclick = openMenu;

/* ============ Pantalla de inicio ============ */
const CHARS = [
  {name:"Señal", txt:"Lee el reloj antes que nadie."},
  {name:"Bitácora", txt:"Anota todo, con su fuente."},
  {name:"Horizonte", txt:"Mira lejos y lee mapas."}
];
function showStart(){
  const st = $("#start"); st.hidden = false;
  if(S.char === null) S.char = 0;
  st.innerHTML = `<div class="st-wrap wrap">
    <p class="eyebrow">Prototipo 3D · Zona 1 de 3</p>
    <h1>Kinética · <em>Comunidad de Moín</em></h1>
    <p class="muted" style="max-width:66ch">Caminá por la comunidad, investigá con el reloj a las personas, animales y objetos marcados, leé la biblioteca de la archivista y superá La codificación de hallazgos.</p>
    <div><p class="eyebrow" style="margin-bottom:8px">Seleccioná al accionador de tu preferencia</p>
    <div class="cards3">${CHARS.map((c,i)=>`<button class="pc" type="button" data-i="${i}" aria-pressed="${S.char===i}"><div class="art"><img src="assets/p${i+1}.png" alt="${c.name}"></div><div><h3>${c.name}</h3><p>${c.txt}</p></div></button>`).join("")}</div></div>
    <div class="ctrls">
      <div><b>Computadora</b><span>WASD o flechas para caminar · Shift para correr · arrastrá con el mouse para girar la cámara · rueda para acercar · E para interactuar</span></div>
      <div><b>Celular o tablet</b><span>Palanca de la izquierda para caminar · deslizá el dedo en la pantalla para girar la cámara · botón verde para interactuar</span></div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn" type="button" id="goIn">${Object.keys(S.clues).length ? "Continuar en la comunidad" : "Entrar a la comunidad"}</button></div>
  </div>`;
  $$(".pc", st).forEach(b => b.onclick = () => { S.char = +b.dataset.i; save(); A.click(); $$(".pc", st).forEach(x => x.setAttribute("aria-pressed", x===b)); setPlayerChar(S.char); });
  $("#goIn").onclick = () => {
    A.resume(); save(); st.hidden = true; $("#hud3").hidden = false; $("#mini").hidden = false;
    if(TOUCH){ $("#joy").hidden = false; $("#actBtn").hidden = false; }
    updateWatch();
    if(!Object.keys(S.clues).length) toast("Investigá los rombos verdes. El reloj guarda cada pista con su fuente.", 4200);
    $("#gl").focus();
  };
}

/* ============ Mundo 3D ============ */
const TOUCH = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
const START = {x:5.3, z:35.5};
let renderer, scene, camera, sun, player, pShadow, playerTex = [], world = {obs:[], inter:[], houses:[]};
let yaw = 0, camDist = 11, camH = 7.5, facing = 1, walkT = 0, stepT = 0;
const keys = {}, joy = {x:0, y:0};
const blocked = () => !$("#modal").hidden || !$("#panel").hidden || !$("#start").hidden;

function mat(color, opts={}){ return new THREE.MeshLambertMaterial(Object.assign({color, flatShading:true}, opts)); }
function box(w,h,d,color,x,y,z,parent,shadow=true){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), typeof color === "number" || typeof color === "string" ? mat(color) : color); m.position.set(x,y,z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m; }
function canvasTex(w, h, draw){ const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }
function svgTex(svg, w, h){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const t = new THREE.CanvasTexture(c);
  const img = new Image(); img.onload = () => { c.getContext("2d").drawImage(img, 0, 0, w, h); t.needsUpdate = true; };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  return t;
}
function sprite(tex, height, aspect){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, alphaTest:.12, fog:true}));
  s.center.set(.5, 0); s.scale.set(height*aspect, height, 1); return s;
}
function blob(r, x=0, z=0){ const m = new THREE.Mesh(new THREE.CircleGeometry(r, 24), new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.28, depthWrite:false})); m.rotation.x = -Math.PI/2; m.position.set(x, .04, z); return m; }
const obsCircle = (x,z,r) => world.obs.push({t:"c", x, z, r});
const obsBox = (x1,z1,x2,z2) => world.obs.push({t:"b", x1:Math.min(x1,x2), x2:Math.max(x1,x2), z1:Math.min(z1,z2), z2:Math.max(z1,z2)});

function personSVG(o){ return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -200 120 206">${person(0, 0, Object.assign({s:1}, o))}</svg>`; }
const DOG_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -70 130 82"><ellipse cx="0" cy="-22" rx="38" ry="20" fill="#a0652f"/><rect x="-30" y="-12" width="8" height="22" fill="#8a5426"/><rect x="20" y="-12" width="8" height="22" fill="#8a5426"/><circle cx="34" cy="-44" r="16" fill="#a0652f"/><path d="M28 -58 l-6 -14 12 8z" fill="#7a4a20"/><ellipse cx="48" cy="-40" rx="9" ry="6" fill="#c08048"/><circle cx="54" cy="-42" r="3" fill="#111"/><circle cx="38" cy="-48" r="2.5" fill="#111"/><path d="M-36 -28 q-18 -14 -10 -30" stroke="#a0652f" stroke-width="7" fill="none"/></svg>`;

function makeRoad(points, width, color){
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], 0, p[1])));
  const N = 140, pos = [], idx = [];
  for(let i=0;i<=N;i++){
    const t = i/N, p = curve.getPoint(t), d = curve.getTangent(t);
    const nx = -d.z, nz = d.x, l = Math.hypot(nx,nz) || 1;
    pos.push(p.x + nx/l*width/2, .03, p.z + nz/l*width/2, p.x - nx/l*width/2, .03, p.z - nz/l*width/2);
    if(i<N){ const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({color, side:THREE.DoubleSide})); m.receiveShadow = true; scene.add(m);
  return curve;
}

  const tri = new THREE.Shape(); tri.moveTo(-d/2, 0); tri.lineTo(d/2, 0); tri.lineTo(0, rise*.92); tri.lineTo(-d/2, 0);

  const c = Math.round(Math.cos(rot)), s = Math.round(Math.sin(rot));
  const corners = [[-w/2-.2, -d/2-.2], [w/2+.2, depthFront]].map(([lx,lz]) => [x + lx*c + lz*s, z - lx*s + lz*c]);
  obsBox(corners[0][0], corners[0][1], corners[1][0], corners[1][1]);

function refreshMarkers(){
  for(const i of world.inter){
    let color = 0x3df58e, show = true, op = .55;
    if(i.kind === "clue"){ if(S.clues[i.id]){ show = false; color = 0xff8f45; op = .25; } }
    else if(i.kind === "repo"){ color = secDone() ? 0xff8f45 : 0x5d7f86; if(repoDone()) { show = false; op = .2; } }
    else if(i.kind === "des"){ color = secDone() && repoDone() ? 0x6fe3ff : 0x5d7f86; if(gameDone()) { show = false; op = .2; } }
    i.marker.visible = show; i.marker.material.color.setHex(color); i.ring.material.color.setHex(color); i.ring.material.opacity = op;
  }
}

  if(!i || blocked()) return;

  if(i.kind === "clue"){
    const was = secDone();
    openClue(i.id, () => {
      updateWatch();
      if(!was && secDone()){ buzzWatch(); toast("El reloj vibra: la archivista de Kinética te espera (rombo naranja)", 4200); }
    });
    return;
  }
  if(i.kind === "repo"){
    if(!secDone()) return npcSay("Archivista de Kinética", "Bloqueado", "«Todavía no. Primero investigá todo lo que hay en la comunidad; el reloj me avisa cuando estés listo.»");
    openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Archivista de Kinética"><div class="sheet-h"><h3>Archivista de Kinética</h3><span class="tag sun">NPC de repositorio</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
      <div class="sheet-b"><p class="quote">«Soy la archivista de Kinética. En esta biblioteca guardo lo que necesitás antes del primer desafío: qué es el análisis de resultados, cómo se pasa del dato a la categoría y qué dice la criminología ambiental.»</p>
      <div class="kv"><div><b>En la biblioteca</b><span>${REPOS.repo1.docs.map(d=>esc(d.t)).join(" · ")}</span></div></div></div>
      <div class="sheet-f"><button class="btn sun" type="button" id="npcGo">Abrir la biblioteca</button></div></div>`);
    V.say("Soy la archivista de Kinética. En esta biblioteca guardo lo que necesitás antes del primer desafío.");
    $("#npcGo").onclick = () => go("repo1");
    return;
  }
  if(i.kind === "des"){
    if(!(secDone() && repoDone())) return npcSay("Agente de desafío", "Bloqueado", secDone() ? "«El desafío se abre cuando hayás leído todos los textos de la biblioteca. Hablá primero con la archivista.»" : "«Primero investigá la comunidad y leé la biblioteca de la archivista. Después te espero aquí.»");
    openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Agente de desafío"><div class="sheet-h"><h3>Agente de desafío</h3><span class="tag live">NPC de desafío</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
      <div class="sheet-b"><div class="phrase"><q>Los datos sueltos no prueban nada hasta que los ordenás.</q></div><p>Desafío 1 de 4: <b>La codificación de hallazgos</b>.</p></div>
      <div class="sheet-f"><button class="btn" type="button" id="npcGo">${gameDone() ? "Repetir el desafío" : "Iniciar el desafío"}</button></div></div>`);
    V.say("Los datos sueltos no prueban nada hasta que los ordenás.", {pitch:.6, rate:.9});
    $("#npcGo").onclick = () => go("game1");
  }
}
function npcSay(title, tag, text){
  openModal(`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><h3>${esc(title)}</h3><span class="tag">${esc(tag)}</span><button class="x" data-close aria-label="Cerrar">${X_ICON}</button></div>
    <div class="sheet-b"><p class="quote">${esc(text)}</p></div><div class="sheet-f"><button class="btn ghost" type="button" data-close>Entendido</button></div></div>`);
  V.say(text);
}

/* ---------- Controles ---------- */
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if(blocked()) return;
  if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright","shift"].includes(k)){ keys[k] = true; e.preventDefault(); }
  if((k === "e" || k === "enter" || k === " ") && near){ e.preventDefault(); interact(near); }
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for(const k in keys) keys[k] = false; });
$("#prompt").onclick = () => interact(near);
$("#prompt").onkeydown = e => { if(e.key === "Enter") interact(near); };
$("#actBtn").onclick = () => interact(near);
// girar la cámara arrastrando
{
  const gl = $("#gl"); let drag = null;
  gl.addEventListener("pointerdown", e => { drag = {id:e.pointerId, x:e.clientX}; gl.setPointerCapture(e.pointerId); });
  gl.addEventListener("pointermove", e => { if(drag && e.pointerId === drag.id){ yaw -= (e.clientX - drag.x) * .006; drag.x = e.clientX; } });
  const end = e => { if(drag && e.pointerId === drag.id) drag = null; };
  gl.addEventListener("pointerup", end); gl.addEventListener("pointercancel", end);
  gl.addEventListener("wheel", e => { camDist = Math.min(17, Math.max(6, camDist + e.deltaY*.01)); camH = camDist*.68; e.preventDefault(); }, {passive:false});
}
// palanca táctil
{
  const base = $("#joy"), knob = $("#knob"); let id = null;
  const move = e => { const r = base.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2); const m = Math.hypot(dx,dy), max = r.width/2 - 10; if(m > max){ dx *= max/m; dy *= max/m; } knob.style.transform = `translate(${dx}px,${dy}px)`; joy.x = dx/max; joy.y = -dy/max; };
  base.addEventListener("pointerdown", e => { id = e.pointerId; base.setPointerCapture(id); move(e); });
  base.addEventListener("pointermove", e => { if(e.pointerId === id) move(e); });
  const end = e => { if(e.pointerId !== id) return; id = null; joy.x = joy.y = 0; knob.style.transform = ""; };
  base.addEventListener("pointerup", end); base.addEventListener("pointercancel", end);
}

/* ---------- Bucle ---------- */
function collide(p){
  const pr = .42;
  for(const o of world.obs){
    if(o.t === "c"){ const dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz), m = o.r + pr; if(d < m && d > 1e-4){ p.x = o.x + dx/d*m; p.z = o.z + dz/d*m; } }
    else { const x1 = o.x1 - pr, x2 = o.x2 + pr, z1 = o.z1 - pr, z2 = o.z2 + pr;
      if(p.x > x1 && p.x < x2 && p.z > z1 && p.z < z2){ const dl = p.x - x1, dr = x2 - p.x, dt = p.z - z1, db = z2 - p.z, mn = Math.min(dl,dr,dt,db);
        if(mn === dl) p.x = x1; else if(mn === dr) p.x = x2; else if(mn === dt) p.z = z1; else p.z = z2; } }
  }
  p.x = Math.max(-29, Math.min(29, p.x)); p.z = Math.max(-31, Math.min(38, p.z));
}
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
let frame = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  frame++;
  if(!$("#panel").hidden) return;
  if(blocked() && frame % 4) return;
  if(player && !blocked()){
    let fx = (keys.w||keys.arrowup?1:0) - (keys.s||keys.arrowdown?1:0) + joy.y;
    let rx = (keys.d||keys.arrowright?1:0) - (keys.a||keys.arrowleft?1:0) + joy.x;
    const mag = Math.min(1, Math.hypot(fx, rx));
    if(mag > .08){
      const n = Math.hypot(fx, rx); fx /= n; rx /= n;
      const speed = (keys.shift ? 9 : 5.5) * mag;
      const fwd = [-Math.sin(yaw), -Math.cos(yaw)], right = [Math.cos(yaw), -Math.sin(yaw)];
      const p = {x: player.position.x + (fwd[0]*fx + right[0]*rx)*speed*dt, z: player.position.z + (fwd[1]*fx + right[1]*rx)*speed*dt};
      collide(p); placePlayer(p.x, p.z);
      if(Math.abs(rx) > .15) facing = rx > 0 ? 1 : -1;
      walkT += dt*speed*1.6; stepT += dt*speed;
      if(stepT > 2.6){ stepT = 0; A.tone && A.tone(140 + Math.random()*40, .05, "triangle", .035); }
    } else walkT = 0;
    player.position.y = Math.abs(Math.sin(walkT)) * .12;
    player.scale.x = 2.3*ASPECT[S.char ?? 0]*facing;
    // elemento más cercano
    let best = null, bd = 1e9;
    for(const i of world.inter){ const d = Math.hypot(i.x - player.position.x, i.z - player.position.z); if(d < i.r && d < bd){ best = i; bd = d; } }
    if(best !== near){
      near = best;
      $("#prompt").hidden = !near; if(near) $("#pText").textContent = near.label;
      $("#prompt kbd").textContent = TOUCH ? "●" : "E";
      $("#actBtn").disabled = !near; $("#actBtn").textContent = near ? (near.kind === "clue" ? (CLUES[near.id].who ? "Hablar" : "Investigar") : "Hablar") : "Acción";
    }
  } else if(blocked()){ if(!$("#prompt").hidden){ $("#prompt").hidden = true; near = null; $("#actBtn").disabled = true; } }
  // cámara en tercera persona
  if(player){
    camTarget.set(player.position.x, 1.3, player.position.z);
    const want = new THREE.Vector3(player.position.x + Math.sin(yaw)*camDist, camH, player.position.z + Math.cos(yaw)*camDist);
    camera.position.lerp(want, 1 - Math.pow(.0015, dt));
    camera.lookAt(camTarget);
    sun.position.set(player.position.x - 38, 34, player.position.z - 26); sun.target.position.set(player.position.x, 0, player.position.z);
  }
  for(const i of world.inter){ if(i.marker.visible){ i.marker.rotation.y = t*2; i.marker.position.y = i.top + .5 + Math.sin(t*3 + i.x)*.12; } }
  if(world.pedRing) world.pedRing.scale.setScalar(1 + Math.sin(t*2)*.05);
  if(world.lora) world.lora.position.y = 3.25 + Math.abs(Math.sin(t*1.7))*.05;
  for(let k=0;k<5;k++){ const f = world["foam"+k]; if(f){ f.position.z = -56.5 - k*2.4 + Math.sin(t*.8 + k)*.8; f.material.opacity = .3 + .25*Math.sin(t*.8 + k); } }
  renderer.render(scene, camera);
  if(!$("#mini").hidden && (Math.floor(t*12) % 2 === 0)) drawMini();
}
function drawMini(){
  const c = $("#mini").getContext("2d"), W = 300, sc = W/72, X = x => (x + 34)*sc, Z = z => (z + 33)*sc;
  c.clearRect(0,0,W,W); c.fillStyle = "rgba(91,138,58,.35)"; c.fillRect(0,0,W,W);
  c.fillStyle = "rgba(226,201,147,.6)"; c.fillRect(0, 0, W, Z(-26)); c.fillStyle = "rgba(42,127,168,.7)"; c.fillRect(0, 0, W, Math.max(0, Z(-30)));
  c.strokeStyle = "#b48553"; c.lineWidth = 4*sc/2.2; c.beginPath(); for(let i=0;i<=40;i++){ const p = world.road.getPoint(i/40); i ? c.lineTo(X(p.x), Z(p.z)) : c.moveTo(X(p.x), Z(p.z)); } c.stroke();
  c.fillStyle = "rgba(20,30,36,.75)"; for(const o of world.obs) if(o.t === "b") c.fillRect(X(o.x1), Z(o.z1), (o.x2-o.x1)*sc, (o.z2-o.z1)*sc);
  for(const i of world.inter){ if(!i.marker.visible) continue; c.fillStyle = "#" + i.marker.material.color.getHexString(); c.beginPath(); c.arc(X(i.x), Z(i.z), 9, 0, 7); c.fill(); }
  if(player){ const px = X(player.position.x), pz = Z(player.position.z); c.save(); c.translate(px, pz); c.rotate(-yaw); c.fillStyle = "#fff"; c.beginPath(); c.moveTo(0,-14); c.lineTo(9,10); c.lineTo(-9,10); c.closePath(); c.fill(); c.restore(); }
}
function applyQuality(){
  if(!renderer) return;
  const low = (S.settings.quality || (TOUCH ? "baja" : "alta")) === "baja";
  renderer.setPixelRatio(Math.min(devicePixelRatio, low ? 1 : 1.75));
  renderer.shadowMap.enabled = !low; sun.castShadow = !low;
  sun.shadow.mapSize.set(low ? 512 : 2048, low ? 512 : 2048); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  scene.traverse(o => { if(o.material){ (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.needsUpdate = true); } });
  resize();
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }

async function boot(){
  try{ await Promise.race([document.fonts.ready, sleep(1500)]); }catch(e){}
  if(!window.THREE){ $("#loading3").textContent = "No se pudo cargar el motor 3D. Revisá la conexión y recargá la página."; return; }
  try{
    renderer = new THREE.WebGLRenderer({canvas:$("#gl"), antialias:true});
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  }catch(e){ $("#loading3").textContent = "Este dispositivo no permite gráficos 3D (WebGL)."; return; }
  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 400);
  if(innerWidth < innerHeight){ camDist = 13.5; camH = 9.5; }
  buildWorld(); applyQuality(); refreshMarkers(); updateWatch();
  camera.position.set(START.x, camH + 6, START.z + camDist + 8);
  addEventListener("resize", resize);
  $("#loading3").remove();
  $("#gl").tabIndex = 0;
  tick(); showStart();
  window.__k3d = {tp:(x,z)=>placePlayer(x,z), near:()=>near && near.id, S:()=>S};
}
boot();
})();
</script>
